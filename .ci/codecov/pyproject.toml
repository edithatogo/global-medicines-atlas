[project]
name = "gma-codecov-verification-tools"
version = "0.1.0"
description = "Isolated, locked tools for verifying and running Codecov uploads"
requires-python = ">=3.15,<3.16"
dependencies = [
  "click>=8.0,<8.3",
  "ijson==3.*",
  "pypi-attestations==0.0.30",
  "PyYAML==6.*",
  "requests>=2.25",
  "sentry-sdk==2.*",
]

[tool.uv]
package = false
