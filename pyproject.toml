[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "global-medicines-atlas"
dynamic = ["version"]
description = "Global comparison of medicine registration, approval, funding, and reimbursement systems"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "Edith Atogo" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "duckdb>=1.4",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "orjson>=3.11",
  "polars[pyarrow]>=1.35",
  "pyarrow>=21",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "rich>=14.2",
  "structlog>=25.4",
  "tenacity>=9.1",
  "typer>=0.16",
  "tzdata>=2026.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
semantic = [
  "lancedb>=0.27",
]
iceberg = [
  "pyiceberg>=0.10",
]

[project.scripts]
global-medicines-atlas = "global_medicines_atlas.cli:app"

[dependency-groups]
test = [
  "beautifulsoup4>=4.13",
  "jsonschema>=4.25",
  "packaging>=26",
  "pyyaml>=6.0.3",
  "pytest-playwright>=0.7",
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "pytest-xdist>=3.8",
  "lancedb>=0.27",
]
test-goblin = [
  { include-group = "test" },
  "hypothesis>=6.151",
  "mutmut>=3.5",
  "pytest-gremlins>=1.8.0b8",
  "pytest-randomly>=4.0",
  "pytest-timeout>=2.4",
]
typing = [
  "basedpyright>=1.36",
  "pyarrow-stubs>=20.0.0.20260625",
  "ruff>=0.12",
  "ty>=0.0.18",
  "types-pyyaml>=6.0.12.20250915",
]
profiling = [
  "scalene>=1.5.55",
]
dev = [
  { include-group = "test-goblin" },
  { include-group = "typing" },
  { include-group = "profiling" },
  { include-group = "edge" },
]
edge = [
  "edgetest>=2026.5.1",
]
security = [
    "cyclonedx-bom>=7.1",
    "pip-audit>=2.9",
    "zizmor>=1.13",
]

[tool.uv]
package = true
default-groups = ["test-goblin"]

[tool.uv.dependency-groups]
test = { requires-python = ">=3.14,<3.15" }
test-goblin = { requires-python = ">=3.14,<3.15" }
typing = { requires-python = ">=3.14,<3.15" }
profiling = { requires-python = ">=3.14,<3.15" }
dev = { requires-python = ">=3.14,<3.15" }
edge = { requires-python = ">=3.14,<3.15" }
security = { requires-python = ">=3.14,<3.15" }

[tool.hatch.version]
source = "vcs"
fallback-version = "0+unknown"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.hatch.build.hooks.vcs]
version-file = "src/global_medicines_atlas/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/global_medicines_atlas"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
minversion = "9.1"
pythonpath = [".", "src"]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "unit: isolated domain and utility tests",
  "integration: adapter, fixture, and component-boundary tests",
  "e2e: complete governed medicine projection workflows",
  "smoke: fast installation and critical-path checks",
  "property: generative invariant tests",
  "metamorphic: transformation-relation tests without test oracles",
  "contract: versioned consumer and provider boundary tests",
  "simulation: deterministic event-sequence and state-transition tests",
  "edge: malformed, boundary, and failure-mode tests",
]
timeout = 30

[tool.pytest-gremlins]
paths = [
  "src/global_medicines_atlas/publication_gate.py",
  "src/global_medicines_atlas/data_layer_archive.py",
  "src/global_medicines_atlas/parity.py",
  "src/global_medicines_atlas/source_health.py",
  "src/global_medicines_atlas/adapters/_receipt.py",
  "src/global_medicines_atlas/adapters/us_drugsfda.py",
  "src/global_medicines_atlas/adapters/us_cms_partd.py",
  "src/global_medicines_atlas/matching.py",
  "src/global_medicines_atlas/matching_evaluation.py",
  "src/global_medicines_atlas/matching_normalization.py",
  "src/global_medicines_atlas/matching_policy.py",
  "src/global_medicines_atlas/review_queue.py",
  "src/global_medicines_atlas/product_contracts.py",
  "src/global_medicines_atlas/query_service.py",
  "src/global_medicines_atlas/cli.py",
  "src/global_medicines_atlas/api.py",
  "src/global_medicines_atlas/atlas.py",
  "src/global_medicines_atlas/product_release.py",
  "src/global_medicines_atlas/datahouse_experiments.py",
]
exclude = ["**/_version.py"]
operators = ["comparison", "boundary", "boolean", "arithmetic", "return"]
workers = 2
cache = true
report = ["console", "json"]
max_pardons = 0

[tool.edgetest]
command = "pytest -q tests/test_columnar.py tests/test_settings.py tests/test_product_contracts.py tests/test_product_api.py tests/test_product_cli.py"

[[tool.edgetest.env]]
name = "contracts"
upgrade = ["pydantic", "pydantic-settings"]
deps = ["pytest", "pytest-timeout"]
python_version = "3.14"

[[tool.edgetest.env]]
name = "columnar"
upgrade = ["duckdb", "polars", "pyarrow"]
deps = ["pytest", "pytest-timeout"]
python_version = "3.14"

[[tool.edgetest.env]]
name = "product"
upgrade = ["fastapi", "httpx", "jinja2", "pydantic", "rich", "typer"]
deps = ["beautifulsoup4", "pytest", "pytest-playwright", "pytest-timeout"]
python_version = "3.14"

[tool.coverage.run]
branch = true
source = ["global_medicines_atlas", "sources.nz.nzulm_fhir"]
parallel = true
omit = ["src/global_medicines_atlas/_version.py"]

[tool.coverage.report]
fail_under = 91
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.basedpyright]
include = ["src", "sources", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "sources"]

[tool.ruff]
target-version = "py314"
line-length = 80
src = ["src", "sources"]
extend-exclude = ["vendor"]
preview = true

[tool.ruff.lint]
select = [
  "A", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "FAST",
  "FBT", "FURB", "I", "ICN", "ISC", "LOG", "N", "PERF", "PIE", "PLC",
  "PLE", "PLR", "PLW", "PTH", "PT", "Q", "RET", "RSE", "RUF", "S",
  "SIM", "SLOT", "T10", "T20", "TC", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
  "missing-trailing-comma", # Ruff formatter owns trailing commas.
  "raise-vanilla-args", # Short domain validation messages remain local.
  "raw-string-in-exception",
  "f-string-in-exception",
  "line-too-long", # Formatter owns wrapping; URLs and evidence text stay intact.
  "typing-only-standard-library-import", # Runtime typing remains explicit.
  "typing-only-first-party-import",
  "relative-imports", # Package-local imports are intentional.
  "too-many-arguments", # Adapter contracts favour explicit named inputs.
  "too-many-positional-arguments",
  "no-self-use", # Protocol implementations intentionally use instance methods.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",     # Pytest functions are inferred and checked by the type gates.
  "D",       # Test names are the executable documentation.
  "magic-value-comparison", # Literal expectations make test contracts legible.
  "assert",    # Assertions are the pytest contract.
]
"scripts/**/*.py" = ["print"]
"scripts/test_goblin.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"scripts/qualify_clean_consumer.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"scripts/generate_nz_asset_inventory.py" = ["too-many-return-statements", "too-many-branches"]
"scripts/profile_smoke.py" = ["module-import-not-at-top-of-file", "assert"]
"tests/test_consumer_qualification.py" = ["import-outside-top-level"]

[tool.ruff.lint.isort]
known-first-party = ["global_medicines_atlas", "sources"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mutmut]
source_paths = [
  "src/global_medicines_atlas/canonical_v2.py",
  "src/global_medicines_atlas/comparison_validity.py",
  "src/global_medicines_atlas/consumer_qualification.py",
  "src/global_medicines_atlas/semantic_retrieval.py",
  "src/global_medicines_atlas/parity.py",
  "src/global_medicines_atlas/source_health.py",
  "src/global_medicines_atlas/adapters/_receipt.py",
  "src/global_medicines_atlas/adapters/us_drugsfda.py",
  "src/global_medicines_atlas/adapters/us_cms_partd.py",
  "src/global_medicines_atlas/matching.py",
  "src/global_medicines_atlas/matching_evaluation.py",
  "src/global_medicines_atlas/matching_normalization.py",
  "src/global_medicines_atlas/matching_policy.py",
  "src/global_medicines_atlas/matching_release.py",
  "src/global_medicines_atlas/review_queue.py",
  "src/global_medicines_atlas/product_contracts.py",
  "scripts/validate_publication_identities.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_source_parity.py",
  "tests/test_source_health.py",
  "tests/test_us_drugsfda_adapter.py",
  "tests/test_us_acquisition.py",
  "tests/test_us_cms_partd_adapter.py",
  "tests/test_matching_pipeline.py",
  "tests/test_matching_evaluation.py",
  "tests/test_matching_normalization.py",
  "tests/test_matching_policy.py",
  "tests/test_review_queue.py",
  "tests/test_product_contracts.py",
  "tests/test_canonical_v2_runtime.py",
  "tests/test_comparison_validity.py",
  "tests/test_comparison_validity_properties.py",
  "tests/test_consumer_qualification.py::test_installed_metadata_rejects_missing_required_field",
  "tests/test_consumer_qualification.py::test_installed_metadata_reports_all_missing_fields_in_required_order",
  "tests/test_consumer_qualification.py::test_installed_metadata_rejects_runtime_version_disagreement",
  "tests/test_consumer_qualification.py::test_installed_metadata_returns_exact_validated_identity",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_fails_closed",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_rejects_non_object_contract_shapes",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_accepts_additive_read_only_contract",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_reports_sorted_removed_paths",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_reports_exact_invalid_path_item",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_reports_sorted_removed_read_methods",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_reports_sorted_forbidden_mutations",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_reports_exact_operation_identity_change",
  "tests/test_consumer_qualification.py::test_openapi_compatibility_accepts_matching_absent_operation_ids",
  "tests/test_semantic_retrieval.py",
  "tests/test_publication_identity_registry.py",
]
also_copy = [
  "src/global_medicines_atlas/",
  "schemas/canonical-medicine-v2.json",
  "schemas/comparison-validity-v1.json",
  "schemas/publication-identity-registry-v1.json",
  "quality/qualifications/publication-identities.json",
  "contracts/openapi-v1.json",
  "tests/fixtures/",
  "scripts/check_source_health.py",
  "scripts/validate_publication_identities.py",
]
mutate_only_covered_lines = true
use_git_change_detection = false
