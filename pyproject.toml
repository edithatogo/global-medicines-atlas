[project]
name = "global-medicines-atlas"
version = "0.1.0"
description = "Global comparison of medicine registration, approval, funding, and reimbursement systems"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.12",
]

[dependency-groups]
test = [
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "pytest-xdist>=3.8",
]
test-goblin = [
  { include-group = "test" },
  "hypothesis>=6.151",
  "mutmut>=3.5",
  "pytest-randomly>=4.0",
  "pytest-timeout>=2.4",
]
typing = [
  "basedpyright>=1.36",
  "ty>=0.0.18",
]
profiling = [
  "scalene>=1.5.55",
]
dev = [
  { include-group = "test-goblin" },
  { include-group = "typing" },
  { include-group = "profiling" },
]

[tool.uv]
package = false
default-groups = ["test-goblin"]

[tool.uv.dependency-groups]
test = { requires-python = ">=3.14,<3.15" }
test-goblin = { requires-python = ">=3.14,<3.15" }
typing = { requires-python = ">=3.14,<3.15" }
profiling = { requires-python = ">=3.14,<3.15" }
dev = { requires-python = ">=3.14,<3.15" }

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
minversion = "9.1"
pythonpath = [".", "src"]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "unit: isolated domain and utility tests",
  "integration: adapter, fixture, and component-boundary tests",
  "e2e: complete governed medicine projection workflows",
  "smoke: fast installation and critical-path checks",
  "property: generative invariant tests",
  "edge: malformed, boundary, and failure-mode tests",
]
timeout = 30

[tool.coverage.run]
branch = true
source = ["global_medicines_atlas", "sources.nz.nzulm_fhir"]
parallel = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.basedpyright]
include = ["src", "sources"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "sources"]

[tool.mutmut]
source_paths = ["sources/nz/nzulm_fhir/"]
pytest_add_cli_args_test_selection = [
  "tests/test_nzulm_fhir_adapter.py",
  "tests/test_nzulm_fhir_properties.py",
]
also_copy = ["vendor/nzmedicines/"]
mutate_only_covered_lines = true
use_git_change_detection = false
