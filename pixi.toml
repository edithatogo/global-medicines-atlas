[workspace]
name = "global-medicines-atlas"
channels = [
  "https://conda.modular.com/max-nightly",
  "https://prefix.dev/modular-community",
  "conda-forge",
]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.0.0b3.dev2026072806"
python = "3.15.*"
uv = ">=0.11"

[tasks]
python-sync = "uv sync --python 3.15 --group dev --locked"
python-test = "uv run --python 3.15 python scripts/test_goblin.py quick"
mojo-check = "mojo run mojo/smoke.mojo"
check = { depends-on = ["python-test", "mojo-check"] }
