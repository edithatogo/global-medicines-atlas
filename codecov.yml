coverage:
  precision: 2
  round: down
  range: "91...100"
  status:
    project:
      default:
        target: 91%
        threshold: 0%
    patch:
      default:
        # New code must remain strictly above the documented 90% floor.
        # Project-wide coverage retains the stronger 91% release gate.
        target: 90.01%
        threshold: 0%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

github_checks:
  annotations: true
