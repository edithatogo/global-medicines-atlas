name: Profile frozen MBS historical workbook value shapes

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit to qualify
        required: true
        type: string

permissions: {}

concurrency:
  group: mbs-historical-workbook-value-shapes
  cancel-in-progress: false

jobs:
  profile:
    name: Profile value shapes / archive ${{ matrix.archive_index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        archive_index: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Read frozen source members and emit aggregate shapes
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
          ARCHIVE_INDEX: ${{ matrix.archive_index }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
          uv run --locked --python 3.15.1 python scripts/profile_mbs_historical_workbook_value_shapes.py \
            --exact-commit "$REQUESTED_COMMIT" --archive-index "$ARCHIVE_INDEX" --output historical-workbook-value-shapes.json
      - name: Retain bounded archive receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: historical-workbook-value-shapes-${{ matrix.archive_index }}
          path: historical-workbook-value-shapes.json
          if-no-files-found: error
          retention-days: 30

  reconcile:
    name: Reconcile exact 91 workbook shape cohort
    needs: [profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: historical-workbook-value-shapes-*
          path: input
      - name: Bind reports to fixed archive indices
        run: |
          set -euo pipefail
          for archive_index in 0 1 2 3 4 5; do
            source="input/historical-workbook-value-shapes-${archive_index}/historical-workbook-value-shapes.json"
            test -f "$source"
            cp "$source" "input/historical-workbook-value-shapes-${archive_index}.json"
          done
      - name: Reconcile candidate and source identities
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
          uv run --locked --python 3.15.1 python scripts/reconcile_mbs_historical_workbook_value_shapes.py \
            --exact-commit "$REQUESTED_COMMIT" --input-dir input --output historical-workbook-value-shape-cohort.json
      - name: Retain aggregate report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: historical-workbook-value-shape-cohort
          path: historical-workbook-value-shape-cohort.json
          if-no-files-found: error
          retention-days: 30
