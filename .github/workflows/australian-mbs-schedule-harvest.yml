name: Governed Australian MBS schedule harvest

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing harvest authorization
        required: true
        type: string
      max_releases:
        description: Max number of recent monthly releases to probe
        required: false
        default: "3"
        type: string
      release_pages:
        description: Comma-separated exact official Downloads page IDs for historical releases
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 18 1 * *" # Monthly check following new MBS Online monthly updates.

permissions: {}

concurrency:
  group: australian-mbs-schedule-harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: Acquire MBS schedule releases, append and anonymously verify
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/build/mbs-hf-home
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Bind main head and exact harvest authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Acquire, publish and verify using anonymous reads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MAX_RELEASES: ${{ inputs.max_releases || '3' }}
          RELEASE_PAGES: ${{ inputs.release_pages || '' }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 python scripts/harvest_australian_mbs_schedule.py \
            --publish-hosted \
            --max-releases "$MAX_RELEASES" \
            --release-pages "$RELEASE_PAGES" \
            --receipt-output build/mbs-schedule-harvest-receipt.json
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Retain verification artifact 10 without outbound messages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-verification-10-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mbs-schedule-harvest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove verified hosted temporary materializations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          path = Path('build/mbs-schedule-harvest-receipt.json')
          receipt = json.loads(path.read_text())
          if receipt.get('anonymous_digest_verification') != 'passed':
              raise RuntimeError('cleanup requires anonymous verification')
          for target in (Path('build/harvest'), Path('build/mbs-hf-home')):
              if target.exists():
                  shutil.rmtree(target)
          receipt['temporary_source_bytes_removed'] = True
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Retain verification artifact 11 without outbound messages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-verification-11-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mbs-schedule-harvest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Record fail-honest run outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : # Outbound comments prohibited; retain workflow artifacts instead.
