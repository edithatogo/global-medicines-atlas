name: Publish October openFDA from a hosted runner

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload SHA-256-matched October files available online
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bulk-archive-openfda-all-20261030
  cancel-in-progress: false

jobs:
  recover:
    name: Recover October files online
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      archive-complete: ${{ steps.completion.outputs.archive-complete }}
      artifact-id: ${{ steps.receipts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Load the frozen October plan from this commit
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p build/openfda-october
          cp quality/source-batches/openfda-all-20261030/publication-plan.json build/openfda-october/plan.json
      - name: Check FDA copies and publish any authorized exact matches
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GMA_MAINTAINER_PUBLICATION_APPROVED: ${{ inputs.publish && 'yes-i-approve-publication' || 'unset' }}
          GMA_PUBLICATION_ENVIRONMENT: ${{ inputs.publish && 'production' || 'unset' }}
          HF_TOKEN: ${{ inputs.publish && secrets.HF_TOKEN || '' }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          # Reuse the upload mode that committed the existing October files.
          HF_HUB_DISABLE_XET: "1"
        run: |
          uv sync --python 3.15.1 --locked
          phase=verify-online
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            phase=publish-online
          fi
          uv run --python 3.15.1 --no-sync --with huggingface-hub==0.34.4 \
            python -m scripts.publish_october_openfda_hosted "$phase" \
            --output build/openfda-october --exact-commit "$GITHUB_SHA"
      - name: Check whether the full inventory is ready for readback
        id: completion
        if: inputs.publish
        run: |
          if [[ -s build/openfda-october/uploaded.json ]]; then
            echo 'archive-complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain October recovery receipts
        id: receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openfda-october-online-${{ github.run_attempt }}
          path: build/openfda-october/
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify October archive
    needs: recover
    if: needs.recover.outputs.archive-complete == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.recover.outputs.artifact-id }}
          path: build/openfda-october/
          merge-multiple: true
      - name: Verify every public file anonymously
        run: |
          uv sync --python 3.15.1 --locked
          uv run --python 3.15.1 --no-sync \
            python -m scripts.publish_october_openfda_hosted verify \
            --output build/openfda-october --exact-commit "$GITHUB_SHA"
      - name: Retain the October checksum receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openfda-october-verification-${{ github.run_attempt }}
          path: build/openfda-october/verified.json
          if-no-files-found: warn
          retention-days: 90
