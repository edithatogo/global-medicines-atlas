name: Publish October openFDA from a hosted runner

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload SHA-256-matched October files available online
        type: boolean
        required: true
        default: false
      private_source:
        description: Use the approved temporary private read-only October source
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bulk-archive-openfda-all-20261030
  cancel-in-progress: false

jobs:
  recover:
    name: Recover October files online
    if: github.ref == 'refs/heads/main' && !inputs.private_source
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      archive-complete: ${{ steps.completion.outputs.archive-complete }}
      artifact-id: ${{ steps.receipts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Load the frozen October plan from this commit
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p build/openfda-october
          cp quality/source-batches/openfda-all-20261030/publication-plan.json build/openfda-october/plan.json
      - name: Check FDA copies and publish any authorized exact matches
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GMA_MAINTAINER_PUBLICATION_APPROVED: ${{ inputs.publish && 'yes-i-approve-publication' || 'unset' }}
          GMA_PUBLICATION_ENVIRONMENT: ${{ inputs.publish && 'production' || 'unset' }}
          HF_TOKEN: ${{ inputs.publish && secrets.HF_TOKEN || '' }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          # Reuse the upload mode that committed the existing October files.
          HF_HUB_DISABLE_XET: "1"
        run: |
          uv sync --python 3.15.1 --locked
          phase=verify-online
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            phase=publish-online
          fi
          uv run --python 3.15.1 --no-sync --with huggingface-hub==0.34.4 \
            python -m scripts.publish_october_openfda_hosted "$phase" \
            --output build/openfda-october --exact-commit "$GITHUB_SHA"
      - name: Check whether the full inventory is ready for readback
        id: completion
        if: inputs.publish
        run: |
          if [[ -s build/openfda-october/uploaded.json ]]; then
            echo 'archive-complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain October recovery receipts
        id: receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openfda-october-online-${{ github.run_attempt }}
          path: build/openfda-october/
          if-no-files-found: error
          retention-days: 90

  publish_private:
    name: Publish October from the private read-only source
    if: github.ref == 'refs/heads/main' && inputs.publish && inputs.private_source
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      id-token: write # Exchange this job identity for temporary Tailscale access.
    outputs:
      archive-complete: ${{ steps.completion.outputs.archive-complete }}
      continuation-needed: ${{ steps.completion.outputs.continuation-needed }}
      artifact-id: ${{ steps.receipts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Load the frozen October plan and synchronize Python 3.15
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p build/openfda-october
          cp quality/source-batches/openfda-all-20261030/publication-plan.json build/openfda-october/plan.json
          uv sync --python 3.15.1 --locked
      - name: Join the archive tailnet for this job
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.GMA_OCTOBER_TS_CLIENT_ID }}
          audience: ${{ secrets.GMA_OCTOBER_TS_AUDIENCE }}
          tags: tag:gma-fda-october
          version: "1.104.7"
          sha256sum: e56693ff74a64f2591b7e819c280635a100aae1ddfb0ef058fcd052b7cd8d16c
          use-cache: "false"
          args: --accept-dns=false
      - name: Transfer validated batches to Hugging Face
        id: transfer
        env:
          GMA_MAINTAINER_PUBLICATION_APPROVED: yes-i-approve-publication
          GMA_PUBLICATION_ENVIRONMENT: production
          GMA_OCTOBER_SOURCE_URL: ${{ secrets.GMA_OCTOBER_SOURCE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_XET: "1"
        run: |
          sudo tailscale set --accept-routes=false
          uv run --python 3.15.1 --no-sync --with huggingface-hub==0.34.4 \
            python -m scripts.publish_october_openfda_hosted publish \
            --output build/openfda-october --exact-commit "$GITHUB_SHA"
      - name: Eligible for automatic October retry
        if: failure() && steps.transfer.outputs.retryable == 'true'
        run: echo 'GitHub can resume this upload from its public checkpoint.'
      - name: Check whether the full inventory is ready for readback
        id: completion
        run: |
          if [[ -s build/openfda-october/uploaded.json ]]; then
            echo 'archive-complete=true' >> "$GITHUB_OUTPUT"
          elif [[ -s build/openfda-october/checkpoint.json ]]; then
            echo 'continuation-needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The publisher retained neither a complete upload nor a checkpoint.' >&2
            exit 1
          fi
      - name: Retain October private source receipts
        id: receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openfda-october-private-${{ github.run_attempt }}
          path: build/openfda-october/
          if-no-files-found: error
          retention-days: 90

  continue_private:
    name: Queue the next October checkpoint
    needs: [publish_private]
    if: needs.publish_private.outputs.continuation-needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the next bounded run of this approved workflow.
    steps:
      - name: Resume the approved private-source run within its temporary window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (( $(date -u +%s) >= $(date -u -d '2026-11-29 05:00:00' +%s) )); then
            echo 'The temporary October continuation window has ended.' >&2
            exit 1
          fi
          gh workflow run publish-october-openfda-hosted.yml \
            --repo edithatogo/global-medicines-atlas --ref main \
            -f publish=true -f private_source=true

  verify:
    name: Verify October archive
    needs: [recover, publish_private]
    if: >-
      ${{ !cancelled() && (needs.recover.outputs.archive-complete == 'true' ||
          needs.publish_private.outputs.archive-complete == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.recover.outputs.artifact-id || needs.publish_private.outputs.artifact-id }}
          path: build/openfda-october/
          merge-multiple: true
      - name: Restore anonymous readbacks from this run
        if: github.run_attempt != '1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: openfda-october-verification-*
          path: build/openfda-october/prior
      - name: Verify every public file anonymously
        id: readback
        run: |
          uv sync --python 3.15.1 --locked
          uv run --python 3.15.1 --no-sync \
            python -m scripts.publish_october_openfda_hosted verify \
            --output build/openfda-october --exact-commit "$GITHUB_SHA"
      - name: Eligible for automatic October retry
        if: failure() && steps.readback.outputs.retryable == 'true'
        run: echo 'GitHub can resume anonymous verification at the same revision.'
      - name: Retain the October checksum receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openfda-october-verification-${{ github.run_attempt }}
          path: |
            build/openfda-october/verified.json
            build/openfda-october/readbacks-*.jsonl
          if-no-files-found: warn
          retention-days: 90
