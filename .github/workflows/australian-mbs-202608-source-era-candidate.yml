name: Qualify August 2026 MBS source-era candidate

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing this candidate qualifier
        required: true
        type: string

permissions: {}

concurrency:
  group: australian-mbs-202608-source-era-candidate
  cancel-in-progress: false

jobs:
  qualify:
    name: Compare exact MBS source bytes and profile candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require exact default-branch identity
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
      - name: Compare pinned B2 bytes with the official August release
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.15.1 python scripts/qualify_mbs_source_era_candidate.py \
            --exact-commit "$REQUESTED_COMMIT" \
            --output mbs-202608-source-era-candidate.json
      - name: Retain aggregate candidate evidence only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-202608-source-era-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: mbs-202608-source-era-candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare July and August source eras in memory
        id: predecessor_comparison
        continue-on-error: true
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.15.1 python scripts/compare_mbs_source_eras.py \
            --exact-commit "$REQUESTED_COMMIT" \
            --output mbs-202607-202608-predecessor-comparison.json
      - name: Retain aggregate predecessor comparison only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-202607-202608-predecessor-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: mbs-202607-202608-predecessor-comparison.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail the run when predecessor comparison is incomplete
        if: steps.predecessor_comparison.outcome != 'success'
        run: exit 1
