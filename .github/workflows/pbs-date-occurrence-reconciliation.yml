name: Reconcile pinned PBS date occurrences
on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing the reviewed qualifier
        required: true
        type: string
permissions: {}
concurrency:
  group: pbs-date-occurrence-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    name: Reconcile exact PBS date occurrences
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Reconcile exact source-field identities
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.15.1 python scripts/reconcile_pbs_date_occurrences.py \
            --exact-commit "$REQUESTED_COMMIT" --output pbs-date-occurrence-crosswalk.json
      - name: Retain bounded value-free receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-date-occurrence-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: pbs-date-occurrence-crosswalk.json
          if-no-files-found: error
          retention-days: 30
