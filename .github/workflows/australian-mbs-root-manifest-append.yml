name: Append verified MBS source identity to the root manifest

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing this one-object append contract
        required: true
        type: string

# Historical uv builds use the patched, content-bound custom CA store.
env:
  SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem

permissions: {}

concurrency:
  group: australian-mbs-root-manifest-append
  cancel-in-progress: false

jobs:
  append:
    name: Append one existing object identity and anonymously verify
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 10
    env:
      HF_HOME: ${{ github.workspace }}/build/m112-root-manifest-cache
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Bind main head, append contract and publication authority
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          uv run --locked --python 3.14.6 python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          contract = json.loads(Path('quality/qualifications/australian-m112-root-manifest-append-contract-20261017.json').read_bytes())
          schema = json.loads(Path('schemas/australian-m112-root-manifest-append-contract-v1.json').read_bytes())
          Draft202012Validator(schema).validate(contract)
          print(json.dumps({'contract_sha256': __import__('hashlib').sha256(Path('quality/qualifications/australian-m112-root-manifest-append-contract-20261017.json').read_bytes()).hexdigest(), 'dataset': contract['dataset'], 'expected_parent_revision': contract['expected_parent_revision'], 'path': contract['object']['path'], 'sha256': contract['object']['sha256'], 'bytes': contract['object']['bytes']}, sort_keys=True))
          PY
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Append metadata and verify anonymously
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 --with huggingface-hub==1.14.0 python scripts/append_australian_mbs_root_manifest.py \
            --exact-commit "$GITHUB_SHA" \
            --receipt-output build/m112-root-manifest-receipt.json
          cat build/m112-root-manifest-receipt.json
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Retain verification artifact 9 without outbound messages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-verification-9-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/m112-root-manifest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Record fail-honest outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : # Outbound comments prohibited; retain workflow artifacts instead.
