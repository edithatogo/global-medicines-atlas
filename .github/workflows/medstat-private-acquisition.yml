name: Retain authorized Medstat aggregate export

on:
  workflow_dispatch:

concurrency:
  group: medstat-private-acquisition
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acquire:
    name: Acquire, verify, and privately retain Medstat export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Acquire and retain without publishing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --python 3.14.6 --with huggingface-hub==1.14.0 python scripts/acquire_medstat_private.py
