name: Retain authorized Medstat aggregate export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    name: Acquire, verify, and privately retain Medstat export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Acquire and retain without publishing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --python 3.14.6 --with huggingface-hub==1.14.0 python scripts/acquire_medstat_private.py
