# Shared repository privacy baseline. Application dependencies are unchanged.
# Documentation: https://github.com/edithatogo/repository-standards/blob/main/docs/privacy-secrets-standard.md
# The isolated Python 3.15.1 scanner preserves upstream Presidio notices.
# Existing repository-specific privacy and secret checks remain independent.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: Personal-identifier detection profile
        type: choice
        options:
          - repository
          - sensitive
        default: repository

permissions:
  contents: read

concurrency:
  group: privacy-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    name: privacy-and-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan with Presidio and Gitleaks
        uses: edithatogo/repository-standards/.github/actions/privacy-secrets@5faba2c520775e61d5a7032eda6677ec1c022d21 # privacy-secrets/v2026.11.16-py3151
        with:
          profile: ${{ inputs.profile || 'repository' }}

