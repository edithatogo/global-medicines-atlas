name: Qualify MBS Gold candidate consumers

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing this qualification
        required: true
        type: string

permissions: {}

concurrency:
  group: australian-mbs-gold-candidate-consumer-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Traverse pinned candidate through Atlas, API, and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require exact default-branch identity
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
      - name: Verify pinned source objects and build the local candidate
        run: |
          set -euo pipefail
          QUALIFICATION_DIR="$RUNNER_TEMP/gma-mbs-gold-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$QUALIFICATION_DIR"
          uv run --locked --python 3.14.6 python scripts/qualify_australian_mbs_gold_real_silver.py --check
          uv run --locked --python 3.14.6 python scripts/export_australian_mbs_gold_candidate_edges.py \
            --output "$QUALIFICATION_DIR/candidate-edges.parquet"
      - name: Traverse every candidate edge through all consumers
        run: |
          set -euo pipefail
          QUALIFICATION_DIR="$RUNNER_TEMP/gma-mbs-gold-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --locked --python 3.14.6 python scripts/qualify_australian_mbs_gold_candidate_consumers.py \
            --edge-file "$QUALIFICATION_DIR/candidate-edges.parquet" \
            --output "$QUALIFICATION_DIR/candidate-consumer-qualification.json"
      - name: Retain the aggregate-only consumer receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: australian-mbs-gold-candidate-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gma-mbs-gold-candidate-${{ github.run_id }}-${{ github.run_attempt }}/candidate-consumer-qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary candidate Parquet and workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/gma-mbs-gold-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
