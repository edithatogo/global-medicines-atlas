name: Inventory exact MBS utilisation CSV headers

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing the header inventory contract
        required: true
        type: string

permissions: {}
concurrency:
  group: australian-mbs-utilisation-harvest
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory four pinned CSV headers independently
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Inventory reviewed CSV header records
        env:
          GH_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HUB_DISABLE_XET: "1"
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit }}
        run: |
          set -euo pipefail
          uv run --frozen --python 3.15.1 --with huggingface-hub==1.14.0 \
            python scripts/inventory_mbs_utilisation_csv_headers.py \
            --exact-commit "$REQUESTED_COMMIT"
      - name: Retain metadata-only header inventory receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-utilisation-header-inventory-receipts-${{ github.run_id }}
          path: build/mbs-utilisation-header-receipts/*.json
          if-no-files-found: ignore
          retention-days: 90
