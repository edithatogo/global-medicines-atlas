name: Governed Australian PBS utilisation harvest

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing harvest authorization
        required: true
        type: string
      remaining_public:
        description: Publish the exact reviewed remaining public-source cohort
        required: false
        default: false
        type: boolean
      incremental_public:
        description: Publish committed public draft batches with verification checkpoints
        required: false
        default: false
        type: boolean
      backfill_all:
        description: Backfill all historical annual files instead of just rolling year
        required: false
        default: false
        type: boolean
      public_export_bundle:
        description: Bounded compressed bytes matching the four committed public export digests
        required: false
        default: ""
        type: string
  schedule:
    - cron: "15 15 15 * *" # Monthly check following Services Australia DOS updates.

permissions: {}

concurrency:
  group: australian-pbs-utilisation-harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: Acquire PBS utilisation, append and anonymously verify
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/build/pbs-hf-home
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Bind main head and exact harvest authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Publish and anonymously verify public batch 1
        id: public_batch_1
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "1"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 1
        if: ${{ inputs.incremental_public == true && steps.public_batch_1.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-1
          path: build/incremental-public/verification-1.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and anonymously verify public batch 2
        id: public_batch_2
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "2"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 2
        if: ${{ inputs.incremental_public == true && steps.public_batch_2.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-2
          path: build/incremental-public/verification-2.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and anonymously verify public batch 3
        id: public_batch_3
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "3"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 3
        if: ${{ inputs.incremental_public == true && steps.public_batch_3.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-3
          path: build/incremental-public/verification-3.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and anonymously verify public batch 4
        id: public_batch_4
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "4"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 4
        if: ${{ inputs.incremental_public == true && steps.public_batch_4.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-4
          path: build/incremental-public/verification-4.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and anonymously verify public batch 5
        id: public_batch_5
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "5"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 5
        if: ${{ inputs.incremental_public == true && steps.public_batch_5.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-5
          path: build/incremental-public/verification-5.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish and anonymously verify public batch 6
        id: public_batch_6
        if: inputs.incremental_public == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_BATCH_INDEX: "6"
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
            python -m scripts.publish_incremental_public_archives

      - name: Retain anonymous proof for public batch 6
        if: ${{ inputs.incremental_public == true && steps.public_batch_6.outputs.applied == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-pbs-${{ github.run_id }}-6
          path: build/incremental-public/verification-6.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain incremental proofs on interruption or failure
        if: ${{ always() && inputs.incremental_public == true }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: incremental-final-pbs-${{ github.run_id }}
          path: build/incremental-public/
          if-no-files-found: warn
          retention-days: 30

      - name: Acquire, publish and verify using anonymous reads
        if: inputs.incremental_public != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BACKFILL_ALL: ${{ inputs.backfill_all == true && '1' || '0' }}
          REMAINING_PUBLIC: ${{ inputs.remaining_public == true && '1' || '0' }}
          PUBLIC_ARCHIVE_DESTINATION: pbs
          PUBLIC_EXPORT_BUNDLE: ${{ inputs.public_export_bundle || '' }}
        run: |
          set -euo pipefail
          if test "$REMAINING_PUBLIC" = 1; then
            uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
              python -m scripts.publish_remaining_public_archives
          elif test -n "$PUBLIC_EXPORT_BUNDLE"; then
            uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 \
              python -m scripts.publish_pbs_public_exports
          else
            uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 python scripts/harvest_australian_pbs_utilisation.py \
              --publish-hosted \
              --receipt-output build/pbs-utilisation-harvest-receipt.json
          fi
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Retain exact public acquisition outcomes
        if: ${{ always() && inputs.remaining_public == true }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/harvest/remaining-public/acquisition.json
          if-no-files-found: warn
          retention-days: 30

      - name: Retain verification artifact 17 without outbound messages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-verification-17-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pbs-utilisation-harvest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove verified hosted temporary materializations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.15.1 python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          path = Path('build/pbs-utilisation-harvest-receipt.json')
          receipt = json.loads(path.read_text())
          if receipt.get('anonymous_digest_verification') != 'passed':
              raise RuntimeError('cleanup requires anonymous verification')
          for target in (Path('build/harvest'), Path('build/pbs-hf-home')):
              if target.exists():
                  shutil.rmtree(target)
          receipt['temporary_source_bytes_removed'] = True
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          : # Outbound comments prohibited; retain workflow artifacts instead.

      - name: Retain verification artifact 18 without outbound messages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-verification-18-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pbs-utilisation-harvest-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Record fail-honest run outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : # Outbound comments prohibited; retain workflow artifacts instead.
