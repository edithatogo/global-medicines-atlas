name: Acquire and publish CMS Part D corpus

on:
  workflow_dispatch:

concurrency:
  group: cms-partd-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  HF_DATASET: edithatogo/global-medicines-atlas-cms-partd-20260827

jobs:
  inventory:
    name: Bind exact public inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - name: Check out publication contracts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Resolve and validate catalogue resources
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p inventory
          curl --fail --show-error --silent --location --retry 5 \
            'https://catalog.data.gov/dataset/quarterly-prescription-drug-plan-formulary-pharmacy-network-and-pricing-information' \
            --output inventory/formulary.html
          curl --fail --show-error --silent --location --retry 5 \
            'https://catalog.data.gov/dataset/medicare-part-d-spending-by-drug' \
            --output inventory/spending.html
          uv run --frozen --python 3.14.6 python - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path, PurePosixPath

          from global_medicines_atlas.cms_partd_acquisition import (
              CMSPartDAuthorization,
              parse_cms_partd_inventory,
          )

          auth = CMSPartDAuthorization.model_validate_json(
              Path('quality/qualifications/cms-partd-acquisition-authorization.json').read_bytes()
          )
          auth.require_payload_authority()
          auth.require_publication_authority()
          inventory = parse_cms_partd_inventory(
              Path('inventory/formulary.html').read_bytes(),
              Path('inventory/spending.html').read_bytes(),
              authorization=auth,
          )
          include = []
          for family, urls in (
              ('formulary', inventory.formulary_urls),
              ('spending', inventory.spending_urls),
          ):
              for raw_url in urls:
                  url = str(raw_url)
                  identity = sha256(url.encode()).hexdigest()
                  basename = PurePosixPath(url.split('?', 1)[0]).name or 'data'
                  include.append({
                      'family': family,
                      'url': url,
                      'identity': identity,
                      'filename': basename,
                      'hub_path': f'data/{family}/{identity}/{basename}',
                  })
          matrix = json.dumps({'include': include}, separators=(',', ':'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'matrix={matrix}\n')
          PY

  initialize:
    name: Initialize public Hugging Face dataset
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create public dataset and attribution card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet huggingface-hub==1.14.0
          cat > README.md <<'EOF'
          ---
          license: other
          pretty_name: Global Medicines Atlas - CMS Part D public source corpus
          ---

          # CMS Part D public source corpus

          Exact official public resources for the CMS Quarterly Prescription Drug Plan
          Formulary, Pharmacy Network, and Pricing Information catalogue through Q2 2026,
          plus the three catalogue resources for Medicare Part D Spending by Drug for the
          2024 reporting period.

          CMS is the source. The formulary resources remain subject to the CMS Agreement
          for Use. Uses must be accurate and non-misleading, preserve source dates,
          specification changes, suppression, and population boundaries, and must not
          characterize these data as net prices, total United States medicine utilization,
          or schema-equivalent across plan years.

          Missing coverage is not negative evidence. The two Data API URLs are default
          representations and are not described as complete datasets; the official CSV is
          retained separately.

          Publication is incremental. Until `manifest.json` lists all 33 payloads and
          `public-verification.json` records anonymous digest verification, the visible
          repository is an incomplete acquisition in progress.
          EOF
          python3 - <<'PY'
          import os
          from huggingface_hub import CommitOperationDelete, HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_DATASET']
          api.create_repo(repo, repo_type='dataset', private=False, exist_ok=True)
          info = api.dataset_info(repo)
          if info.private:
              raise RuntimeError('CMS Part D dataset must be public from initialization')
          paths = {item.rfilename for item in info.siblings}
          stale_markers = sorted(
              {
                  'manifest.json',
                  'public-verification.json',
                  'bronze/qualification.json',
                  'bronze/cms-partd-payload-manifest.parquet',
                  'bronze/cms-partd-archive-members.parquet',
              }
              & paths
          )
          stale_markers.extend(
              sorted(path for path in paths if path.startswith('bronze/shards/'))
          )
          if stale_markers:
              api.create_commit(
                  repo_id=repo,
                  repo_type='dataset',
                  operations=[
                      CommitOperationDelete(path_in_repo=path)
                      for path in stale_markers
                  ],
                  commit_message='Invalidate stale CMS Part D completion markers',
              )
          api.upload_file(
              repo_id=repo,
              repo_type='dataset',
              path_or_fileobj='README.md',
              path_in_repo='README.md',
              commit_message='Initialize public CMS Part D publication',
          )
          PY

  acquire_publish:
    name: Publish ${{ matrix.family }} ${{ matrix.filename }}
    needs: [inventory, initialize]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Check out qualification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download and inspect exact source payload
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_FAMILY: ${{ matrix.family }}
          SOURCE_IDENTITY: ${{ matrix.identity }}
          HUB_PATH: ${{ matrix.hub_path }}
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes p7zip-full
          fi
          mkdir -p payload receipt
          curl --fail --show-error --silent --location --retry 20 --retry-all-errors \
            --connect-timeout 30 --max-time 18000 \
            "$SOURCE_URL" --output "payload/$SOURCE_IDENTITY"
          uv run --frozen --python 3.14.6 python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from hashlib import sha256
          from pathlib import Path

          from global_medicines_atlas.bronze_admission import (
              BronzeAdmissionState,
              ValidationResult,
              create_admission_decision,
          )
          from global_medicines_atlas.cms_partd_acquisition import inspect_cms_partd_payload
          from global_medicines_atlas.receipts import (
              AcquisitionMethod,
              AcquisitionStatus,
              DataSensitivity,
              EvidenceClass,
              HttpRetrievalEvidence,
              PayloadEvidence,
              PersonalDataState,
              PublicationDisposition,
              RetrievalEvidence,
              RightsState,
              SensitivityClassification,
              SourceIdentity,
              SourceReceipt,
              TransformationEvidence,
              acquisition_event_from_receipt,
              require_temporal,
          )
          from global_medicines_atlas.reuse_gate import (
              ReuseDisposition,
              ReuseGateDecision,
              SEARCH_SURFACES,
          )

          path = Path('payload') / os.environ['SOURCE_IDENTITY']
          retrieved_at = datetime.now(UTC)
          evidence = inspect_cms_partd_payload(
              path,
              url=os.environ['SOURCE_URL'],
              family=os.environ['SOURCE_FAMILY'],
          )
          source_id = f"us-cms-partd-{os.environ['SOURCE_FAMILY']}"
          receipt = SourceReceipt(
              receipt_id=f"cms-partd-{os.environ['SOURCE_IDENTITY']}",
              source=SourceIdentity(
                  catalog_id=source_id,
                  source_id=source_id,
                  jurisdiction='US',
                  authority='Centers for Medicare & Medicaid Services',
                  dataset_title=(
                      'Quarterly Prescription Drug Plan Formulary, Pharmacy Network, and Pricing Information'
                      if os.environ['SOURCE_FAMILY'] == 'formulary'
                      else 'Medicare Part D Spending by Drug'
                  ),
                  catalog_version='inventory-bound-2026-08-27',
              ),
              retrieval=RetrievalEvidence(
                  uri=os.environ['SOURCE_URL'],
                  retrieved_at=retrieved_at,
                  acquisition_method=AcquisitionMethod.DOWNLOAD,
                  status=AcquisitionStatus.SUCCEEDED,
                  http=HttpRetrievalEvidence(
                      original_uri=os.environ['SOURCE_URL'],
                      final_uri=os.environ['SOURCE_URL'],
                      http_method='GET',
                      http_status=200,
                      observed_byte_length=evidence.byte_count,
                      acquisition_agent_version='cms-partd-publication-v1',
                  ),
              ),
              payload=PayloadEvidence(
                  sha256=evidence.sha256,
                  byte_count=evidence.byte_count,
              ),
              reuse=ReuseGateDecision(
                  source_id=source_id,
                  disposition=ReuseDisposition.ACQUIRE_NEW,
                  searched_surfaces=SEARCH_SURFACES,
                  candidates=(),
                  rationale=(
                      'Exact maintainer-approved inventory requires a fresh official CMS acquisition; '
                      'no qualified payload copy was present in the governed publication index.'
                  ),
              ),
              rights_state=RightsState.PERMITTED,
              rights_reference=(
                  'https://data.cms.gov/sites/default/files/2023-10/4eeb19e1-525b-4a4e-9766-b33ff084fc5c/AGREEMENT-FOR-USE.pdf'
                  if os.environ['SOURCE_FAMILY'] == 'formulary'
                  else 'https://www.usa.gov/government-works'
              ),
              sensitivity=SensitivityClassification(
                  data_sensitivity=DataSensitivity.NON_SENSITIVE,
                  personal_data=PersonalDataState.NONE,
                  publication=PublicationDisposition.PERMITTED,
                  reason_codes=('official_public_aggregate_cms_resource',),
              ),
              evidence_class=EvidenceClass.LIVE,
              transformation=TransformationEvidence(
                  transformation_id='cms-partd-raw-retention-v1',
                  transformation_sha256=sha256(b'cms-partd-raw-retention-v1').hexdigest(),
                  output_sha256=evidence.sha256,
                  output_byte_count=evidence.byte_count,
              ),
          )
          temporal = require_temporal(receipt.temporal)
          landed = create_admission_decision(
              acquisition_id=temporal.acquisition_id,
              content_id=evidence.sha256,
              state=BronzeAdmissionState.LANDED,
              validation_results=(ValidationResult(
                  check_id='streaming-source-validation',
                  passed=True,
                  message='Payload digest and bounded source-native archive validation passed',
              ),),
              decided_at=retrieved_at,
          )
          accepted = create_admission_decision(
              acquisition_id=temporal.acquisition_id,
              content_id=evidence.sha256,
              state=BronzeAdmissionState.ACCEPTED,
              validation_results=landed.validation_results,
              decided_at=retrieved_at,
              supersedes_decision_id=landed.decision_id,
          )
          receipt = {
              **evidence.model_dump(mode='json'),
              'hub_path': os.environ['HUB_PATH'],
              'source_bytes_committed_to_git': False,
              'source_receipt': receipt.model_dump(mode='json'),
              'acquisition_event': acquisition_event_from_receipt(receipt).model_dump(mode='json'),
              'admission_history': [
                  landed.model_dump(mode='json'),
                  accepted.model_dump(mode='json'),
              ],
              'storage_receipt': None,
          }
          Path('receipt/receipt.json').write_text(
              json.dumps(receipt, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Qualify hosted Bronze shard
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_FAMILY: ${{ matrix.family }}
          SOURCE_IDENTITY: ${{ matrix.identity }}
          HUB_PATH: ${{ matrix.hub_path }}
        run: |
          set -euo pipefail
          expected=$(jq -r '.sha256' receipt/receipt.json)
          qualified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          uv run --frozen --python 3.14.6 python scripts/qualify_cms_partd_shard.py \
            --payload "payload/$SOURCE_IDENTITY" \
            --url "$SOURCE_URL" \
            --family "$SOURCE_FAMILY" \
            --identity "$SOURCE_IDENTITY" \
            --hub-path "$HUB_PATH" \
            --expected-sha256 "$expected" \
            --output bronze \
            --qualified-at "$qualified_at"
          test ! -e bronze/private-archive.tar
          test ! -e bronze/clean-room

      - name: Upload verified payload to public Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_IDENTITY: ${{ matrix.identity }}
          HUB_PATH: ${{ matrix.hub_path }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          uv run --python 3.14.6 --with huggingface-hub==1.14.0 python - <<'PY'
          import os
          import time
          import json
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          api = HfApi(token=os.environ['HF_TOKEN'])
          payload = Path('payload') / os.environ['SOURCE_IDENTITY']
          receipt_path = Path('receipt/receipt.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['storage_receipt'] = {
              'schema_id': 'global-medicines-atlas.cms-partd-huggingface-storage',
              'schema_version': 1,
              'state': 'public',
              'uri': f"hf://datasets/{os.environ['HF_DATASET']}/{os.environ['HUB_PATH']}",
              'sha256': receipt['sha256'],
              'byte_count': receipt['byte_count'],
              'administrative_domain': 'huggingface.co',
          }
          receipt_path.write_text(
              json.dumps(receipt, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8',
          )
          receipt_repo_path = f"evidence/receipts/{os.environ['SOURCE_IDENTITY']}.json"
          already_published = False
          try:
              public_receipt = json.loads(Path(hf_hub_download(
                  repo_id=os.environ['HF_DATASET'],
                  repo_type='dataset',
                  filename=receipt_repo_path,
                  token=False,
              )).read_text(encoding='utf-8'))
              already_published = (
                  public_receipt['sha256'] == receipt['sha256']
                  and public_receipt['hub_path'] == receipt['hub_path']
                  and public_receipt['storage_receipt']['state'] == 'public'
              )
              if already_published:
                  receipt = public_receipt
                  receipt_path.write_text(
                      json.dumps(receipt, separators=(',', ':'), sort_keys=True) + '\n',
                      encoding='utf-8',
                  )
          except Exception:
              already_published = False
          if not already_published:
              for attempt in range(1, 7):
                  try:
                      api.upload_file(
                          repo_id=os.environ['HF_DATASET'],
                          repo_type='dataset',
                          path_or_fileobj=payload,
                          path_in_repo=os.environ['HUB_PATH'],
                          commit_message=f"Publish CMS Part D payload {os.environ['SOURCE_IDENTITY']}",
                      )
                      api.upload_file(
                          repo_id=os.environ['HF_DATASET'],
                          repo_type='dataset',
                          path_or_fileobj=receipt_path,
                          path_in_repo=receipt_repo_path,
                          commit_message=f"Record CMS Part D B1 evidence {os.environ['SOURCE_IDENTITY']}",
                      )
                      break
                  except Exception:
                      if attempt == 6:
                          raise
                      time.sleep(attempt * 15)
          PY

      - name: Retain digest receipt only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cms-partd-receipt-${{ matrix.identity }}
          path: |
            receipt/receipt.json
            bronze/qualification.json
            bronze/payload-manifest.parquet
            bronze/archive-members.parquet
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Publish corpus manifest
    needs: acquire_publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download digest receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cms-partd-receipt-*
          path: receipts

      - name: Build and publish exact manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet \
            huggingface-hub==1.14.0 pyarrow==25.0.0
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from hashlib import sha256
          from pathlib import Path
          from huggingface_hub import CommitOperationAdd, HfApi
          import pyarrow as pa
          import pyarrow.parquet as pq

          receipts = [
              json.loads(path.read_text(encoding='utf-8'))
              for path in sorted(Path('receipts').glob('**/receipt.json'))
          ]
          if len(receipts) != 33:
              raise RuntimeError(f'expected 33 receipts, found {len(receipts)}')
          shard_reports = [
              json.loads(path.read_text(encoding='utf-8'))
              for path in sorted(Path('receipts').glob('**/bronze/qualification.json'))
          ]
          if len(shard_reports) != 33:
              raise RuntimeError(f'expected 33 Bronze shards, found {len(shard_reports)}')
          if any(row['clean_room_recovered_payload_count'] != 1 for row in shard_reports):
              raise RuntimeError('CMS Part D clean-room recovery is incomplete')
          bronze_dir = Path('bronze')
          bronze_dir.mkdir()
          payload_tables = [
              pq.read_table(path)
              for path in sorted(Path('receipts').glob('**/bronze/payload-manifest.parquet'))
          ]
          member_tables = [
              pq.read_table(path)
              for path in sorted(Path('receipts').glob('**/bronze/archive-members.parquet'))
          ]
          payload_manifest = bronze_dir / 'cms-partd-payload-manifest.parquet'
          member_manifest = bronze_dir / 'cms-partd-archive-members.parquet'
          pq.write_table(pa.concat_tables(payload_tables), payload_manifest)
          pq.write_table(pa.concat_tables(member_tables), member_manifest)
          qualification = {
              'schema_id': 'global-medicines-atlas.cms-partd-bronze-qualification',
              'schema_version': 1,
              'qualified_at': max(r['qualified_at'] for r in shard_reports),
              'prompt_id': 31,
              'source_ids': ['us-cms-partd-formulary', 'us-cms-partd-spending'],
              'decision_status': 'approved_public',
              'payload_count': len(shard_reports),
              'formulary_release_count': sum(r['family'] == 'formulary' for r in shard_reports),
              'spending_resource_count': sum(r['family'] == 'spending' for r in shard_reports),
              'payload_byte_count': sum(r['byte_count'] for r in shard_reports),
              'archive_member_count': sum(r['archive_member_count'] for r in shard_reports),
              'payload_manifest_sha256': sha256(payload_manifest.read_bytes()).hexdigest(),
              'archive_member_manifest_sha256': sha256(member_manifest.read_bytes()).hexdigest(),
              'private_archive_shard_count': len(shard_reports),
              'clean_room_recovered_payload_count': sum(r['clean_room_recovered_payload_count'] for r in shard_reports),
              'source_bytes_committed': False,
              'source_bytes_retained_on_runners': False,
              'publication_performed_by_github_actions': True,
              'agreement_for_use_applies': True,
              'accurate_and_non_misleading_use_required': True,
              'total_us_utilisation_claimed': False,
              'net_price_claimed': False,
              'cross_plan_year_schema_equivalence_claimed': False,
              'payloads': sorted(shard_reports, key=lambda row: row['identity']),
          }
          qualification_path = bronze_dir / 'qualification.json'
          qualification_path.write_text(
              json.dumps(qualification, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          manifest = {
              'schema_id': 'global-medicines-atlas.cms-partd-public-manifest',
              'schema_version': 1,
              'published_at': datetime.now(UTC).isoformat(),
              'payload_count': len(receipts),
              'formulary_release_count': sum(r['family'] == 'formulary' for r in receipts),
              'spending_resource_count': sum(r['family'] == 'spending' for r in receipts),
              'agreement_for_use_applies': True,
              'payloads': receipts,
          }
          Path('manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_commit(
              repo_id=os.environ['HF_DATASET'],
              repo_type='dataset',
              operations=[
                  CommitOperationAdd(
                      path_in_repo='manifest.json', path_or_fileobj='manifest.json'
                  ),
                  *(
                      CommitOperationAdd(
                          path_in_repo=f'bronze/{path.name}', path_or_fileobj=path
                      )
                      for path in (payload_manifest, member_manifest, qualification_path)
                  ),
              ],
              commit_message='Publish exact CMS Part D corpus manifest',
          )
          info = api.dataset_info(os.environ['HF_DATASET'], files_metadata=True)
          if info.private:
              raise RuntimeError('CMS Part D dataset is unexpectedly private')
          paths = {sibling.rfilename for sibling in info.siblings}
          expected = {
              'README.md',
              'manifest.json',
              'bronze/qualification.json',
              'bronze/cms-partd-payload-manifest.parquet',
              'bronze/cms-partd-archive-members.parquet',
              *(r['hub_path'] for r in receipts),
          }
          expected.update(
              f"evidence/receipts/{sha256(r['url'].encode()).hexdigest()}.json"
              for r in receipts
          )
          missing = expected - paths
          if missing:
              raise RuntimeError(f'public dataset is missing paths: {sorted(missing)}')
          public = HfApi().dataset_info(
              os.environ['HF_DATASET'], files_metadata=True
          )
          if public.private or public.sha != info.sha:
              raise RuntimeError('public CMS Part D revision verification failed')
          print(public.sha)
          PY

  verify_public:
    name: Verify public ${{ matrix.family }} ${{ matrix.filename }}
    needs: [inventory, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Restore anonymously and verify digest
        env:
          SOURCE_IDENTITY: ${{ matrix.identity }}
          HUB_PATH: ${{ matrix.hub_path }}
        run: |
          set -euo pipefail
          mkdir -p verification
          encoded_path=$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ['HUB_PATH'], safe='/'))
          PY
          )
          curl --fail --show-error --silent --location --retry 20 --retry-all-errors \
            --connect-timeout 30 --max-time 18000 \
            "https://huggingface.co/datasets/${HF_DATASET}/resolve/main/${encoded_path}" \
            --output payload
          curl --fail --show-error --silent --location --retry 10 --retry-all-errors \
            "https://huggingface.co/datasets/${HF_DATASET}/resolve/main/evidence/receipts/${SOURCE_IDENTITY}.json" \
            --output receipt.json
          expected=$(jq -r '.sha256' receipt.json)
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Public receipt does not contain a valid payload digest" >&2
            exit 1
          fi
          observed=$(sha256sum payload | cut -d' ' -f1)
          if [[ "$observed" != "$expected" ]]; then
            echo "Anonymous Hugging Face digest mismatch" >&2
            exit 1
          fi
          bytes=$(stat --format=%s payload)
          jq -n \
            --arg hub_path "$HUB_PATH" \
            --arg sha256 "$observed" \
            --argjson byte_count "$bytes" \
            '{hub_path:$hub_path,sha256:$sha256,byte_count:$byte_count,anonymous_restore:true}' \
            > "verification/${SOURCE_IDENTITY}.json"

      - name: Retain anonymous verification receipt only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cms-partd-public-verification-${{ matrix.identity }}
          path: verification/${{ matrix.identity }}.json
          if-no-files-found: error
          retention-days: 7

  complete:
    name: Record complete public verification
    needs: verify_public
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download anonymous verification receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cms-partd-public-verification-*
          path: verification

      - name: Publish public verification receipt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet huggingface-hub==1.14.0
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from huggingface_hub import HfApi

          receipts = [
              json.loads(path.read_text(encoding='utf-8'))
              for path in sorted(Path('verification').glob('**/*.json'))
          ]
          if len(receipts) != 33 or any(not row['anonymous_restore'] for row in receipts):
              raise RuntimeError(f'expected 33 anonymous verification receipts, found {len(receipts)}')
          payload = {
              'schema_id': 'global-medicines-atlas.cms-partd-public-verification',
              'schema_version': 1,
              'verified_at': datetime.now(UTC).isoformat(),
              'payload_count': len(receipts),
              'anonymous_digest_match': True,
              'payloads': receipts,
          }
          path = Path('public-verification.json')
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          api = HfApi(token=os.environ['HF_TOKEN'])
          result = api.upload_file(
              repo_id=os.environ['HF_DATASET'],
              repo_type='dataset',
              path_or_fileobj=path,
              path_in_repo=path.name,
              commit_message='Record anonymous CMS Part D corpus verification',
          )
          public = HfApi().dataset_info(os.environ['HF_DATASET'], files_metadata=True)
          if public.private or public.sha != result.oid:
              raise RuntimeError('completed public CMS Part D revision is not anonymously visible')
          if path.name not in {item.rfilename for item in public.siblings}:
              raise RuntimeError('public verification receipt is not anonymously visible')
          print(public.sha)
          PY
