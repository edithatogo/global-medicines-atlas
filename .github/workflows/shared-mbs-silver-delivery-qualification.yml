name: Qualify existing MBS Silver delivery roles

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact main commit containing the qualification code
        required: true
        type: string

permissions: {}

concurrency:
  group: shared-mbs-silver-delivery-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify exact existing July MBS Silver objects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require exact default-branch identity
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
      - name: Qualify the existing six-table role set
        env:
          OUTPUT_DIR: ${{ runner.temp }}/gma-mbs-silver-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.15.1 python scripts/qualify_mbs_silver_delivery_roles.py \
            --output-dir "$OUTPUT_DIR" \
            --producer-commit "$GITHUB_SHA"
      - name: Retain aggregate-only qualification receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shared-mbs-silver-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gma-mbs-silver-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary qualification reports
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/gma-mbs-silver-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf "$OUTPUT_DIR"
