name: Historical accessibility audit (manual only)
on:
  workflow_dispatch:
concurrency:
  group: hosted-accessibility-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    name: Hosted WCAG automated audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.6'
      - name: Install locked audit tools
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem
        run: |
          uv sync --python 3.15.1 --locked --group dev
          uv run --no-sync playwright install --with-deps chromium
          npm ci --ignore-scripts --prefix deployment/accessibility
      - name: Audit candidate or native deployment
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem
        run: |
          uv run --no-sync python scripts/audit_hosted_accessibility.py --commit "$GITHUB_SHA" --axe deployment/accessibility/node_modules/axe-core/axe.min.js --receipt build/hosted-accessibility.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: hosted-accessibility
          path: build/hosted-accessibility.json
