name: Test-Goblin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: test-goblin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.14 / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, integration, e2e, smoke, property, edge]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize Python 3.14 Test-Goblin environment
        run: uv sync --python 3.14.6 --group test-goblin --locked
      - name: Run ${{ matrix.lane }} tests
        run: uv run --python 3.14.6 --group test-goblin python scripts/test_goblin.py ${{ matrix.lane }}

  quality:
    name: Python 3.14 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [routine, strict, coverage, mutation, profile]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize Python 3.14 development environment
        run: uv sync --python 3.14.6 --group dev --locked
      - name: Run Test-Goblin ${{ matrix.profile }} profile
        run: uv run --python 3.14.6 --group dev python scripts/test_goblin.py ${{ matrix.profile }}
      - name: Upload coverage
        if: matrix.profile == 'coverage'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload Scalene profile
        if: matrix.profile == 'profile'
        uses: actions/upload-artifact@v4
        with:
          name: scalene-profile
          path: scalene-profile.json
          if-no-files-found: error
          retention-days: 14
