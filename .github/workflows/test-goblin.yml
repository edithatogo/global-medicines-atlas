name: Test-Goblin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-goblin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.14 / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required only for keyless Codecov OIDC upload.
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, integration, e2e, smoke, property, edge]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize Python 3.14 Test-Goblin environment
        run: uv sync --python 3.14.6 --group test-goblin --locked
      - name: Run ${{ matrix.lane }} tests
        env:
          TEST_GOBLIN_COVERAGE: "1"
          TEST_GOBLIN_LANE: ${{ matrix.lane }}
        run: uv run --python 3.14.6 --group test-goblin python scripts/test_goblin.py "$TEST_GOBLIN_LANE"
      - name: Upload ${{ matrix.lane }} coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage-${{ matrix.lane }}.xml
          flags: ${{ matrix.lane }}
          name: ${{ matrix.lane }}
          fail_ci_if_error: true
          use_oidc: true

  quality:
    name: Python 3.14 / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required only for keyless Codecov OIDC upload.
    strategy:
      fail-fast: false
      matrix:
        profile: [routine, strict, package, coverage, mutation, gremlins, dependencies, regeneration, profile]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize Python 3.14 development environment
        run: uv sync --python 3.14.6 --group dev --locked
      - name: Run Test-Goblin ${{ matrix.profile }} profile
        env:
          TEST_GOBLIN_PROFILE: ${{ matrix.profile }}
        run: uv run --python 3.14.6 --group dev python scripts/test_goblin.py "$TEST_GOBLIN_PROFILE"
      - name: Upload coverage
        if: matrix.profile == 'coverage'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.xml
          flags: full
          name: full
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload durable quality receipts
        if: matrix.profile == 'mutation' || matrix.profile == 'profile'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-receipt-${{ matrix.profile }}
          path: build/quality-receipts/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload authoritative Mutmut statistics
        if: matrix.profile == 'mutation'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mutmut-authoritative-statistics
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Scalene profile
        if: matrix.profile == 'profile'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scalene-profile
          path: scalene-profile.json
          if-no-files-found: error
          retention-days: 14

  mojo:
    name: Mojo nightly / smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: "v0.73.0"
          cache: true
          frozen: true
      - name: Run locked Mojo canary
        run: pixi run mojo-check
