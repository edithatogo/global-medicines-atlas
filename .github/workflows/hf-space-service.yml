name: Free hosted API and Atlas candidate

on:
  pull_request:
    paths:
      - ".github/workflows/hf-space-service.yml"
      - "deployment/hf-space/**"
      - "deployment/render/**"
      - "render.yaml"
      - "src/global_medicines_atlas/hosted_service.py"
      - "src/global_medicines_atlas/serving.py"
      - "scripts/deploy_hf_space.py"
      - "tests/test_serving.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".ci/trust/cacert.pem"
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact reviewed commit for candidate or endpoint verification
        required: true
        type: string
      endpoint:
        description: Optional verified Render free-service URL for read-only checks
        required: false
        default: ""
        type: string

permissions: {}
concurrency:
  group: gma-hosted-space-${{ github.ref }}
  cancel-in-progress: false
env:
  SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

jobs:
  candidate:
    if: github.event_name == 'pull_request' || inputs.endpoint == ''
    name: Build and exercise hosted service candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Install the governed runtime and build the existing package
        run: |
          set -euo pipefail
          uv sync --python 3.15.1 --locked --group dev
          uv run --no-sync python -c 'import platform; assert platform.python_version() == "3.15.1"'
          mkdir -p build/hf-space
          uv build --python 3.15.1 --out-dir build/space-dist
          uv export --locked --python 3.15.1 --no-dev --no-default-groups --extra server --no-emit-project --format requirements-txt --output-file build/hf-space/requirements.txt
          cp deployment/hf-space/Dockerfile deployment/hf-space/README.md build/hf-space/
          cp LICENSE build/hf-space/
          cp .ci/trust/cacert.pem build/hf-space/
          cp build/space-dist/*.whl build/hf-space/
          printf '\nENV GMA_APPLICATION_COMMIT=%s\n' "$GITHUB_SHA" >> build/hf-space/Dockerfile
      - name: Build the real Docker Space image
        run: docker build --tag gma-hosted-candidate build/hf-space
      - name: Install the existing Chromium qualification tool
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Exercise actual archive bootstrap, restart and browser behavior
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1:7860:7860 --env GMA_CURSOR_SECRET=synthetic-ci-only-signing-value gma-hosted-candidate)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7860/api/v1/readiness >/dev/null; then break; fi
            sleep 5
          done
          curl --fail --silent http://127.0.0.1:7860/api/v1/readiness >/dev/null
          docker restart "$container" >/dev/null
          uv run --no-sync python scripts/deploy_hf_space.py --url http://127.0.0.1:7860 --exact-commit "$GITHUB_SHA" --receipt build/hosted-candidate-verification.json
      - name: Preserve the code-only deployment candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hf-space-code-candidate
          path: build/hf-space/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded qualification evidence without source payloads
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hf-space-candidate-verification
          path: build/hosted-candidate-verification.json
          if-no-files-found: ignore
          retention-days: 30

  verify_native:
    name: Verify the selected free native endpoint
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.endpoint != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Verify the actual endpoint without a provider credential
        env:
          EXACT_COMMIT: ${{ inputs.exact_commit }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -euo pipefail
          uv sync --python 3.15.1 --locked --group dev
          uv run --no-sync python scripts/deploy_hf_space.py --http-only --url "$ENDPOINT" --exact-commit "$EXACT_COMMIT" --receipt build/free-native-verification.json
      - name: Preserve native verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: free-native-verification
          path: build/free-native-verification.json
          if-no-files-found: error
          retention-days: 30
