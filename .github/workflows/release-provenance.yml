name: Release provenance

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attest:
    name: Build and attest published release
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to attach the attested bytes to the release.
      id-token: write # Required for keyless Sigstore identity.
      attestations: write # Required to store the GitHub artifact attestation.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Build release distributions
        run: uv build --out-dir dist
      - name: Persist attested release distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact distributions as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Attest release distributions
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
