name: Qualify pinned historical PBS projections
on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing the reviewed qualifier
        required: true
        type: string
permissions: {}
concurrency:
  group: pbs-historical-projection-qualification
  cancel-in-progress: false
jobs:
  prepare-reference-index:
    name: Prepare streaming PBS global reference index
    needs: qualify
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Stream one digest-bound global index
        timeout-minutes: 55
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.14.6 python scripts/prepare_historical_pbs_reference_node.py \
            --exact-commit "$REQUESTED_COMMIT" --reference-shards 16 --global-index \
            --output node --receipt reference-index-receipt.json
      - name: Retain only the derived index and bounded receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-reference-node-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            node/reference-index.json
            reference-index-receipt.json
          if-no-files-found: error
          retention-days: 1
  prepare:
    name: Assemble verified transient PBS shard inputs
    needs: [prepare-reference-index, prepare-reference-groups]
    if: always() && needs.prepare-reference-index.result == 'success' && needs.prepare-reference-groups.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      artifact_suffix: ${{ steps.identity.outputs.suffix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Bind preparation artifact identity
        id: identity
        run: echo "suffix=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pbs-reference-node-*-${{ github.run_id }}-*
          path: nodes
      - name: Assemble exact index and partition coverage
        timeout-minutes: 55
        run: |
          uv run --locked --python 3.14.6 python scripts/assemble_historical_pbs_reference_manifest.py \
            --input nodes --output prepared/references --reference-shards 16
          cp prepared/references/preparation-receipt.json pbs-preparation.json
      - name: Retain transient verified reference inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-reference-complete-${{ steps.identity.outputs.suffix }}
          path: prepared/references
          if-no-files-found: error
          retention-days: 1
      - name: Retain bounded preparation receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-preparation-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: pbs-preparation.json
          if-no-files-found: error
          retention-days: 30
  qualify:
    name: Verify PBS phase / ${{ matrix.projection }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        projection: [native, domain, entities, dates]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Qualify one phase from the pinned public source
        timeout-minutes: 55
        env:
          PROJECTION: ${{ matrix.projection }}
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/qualify_historical_pbs_public.py \
            --exact-commit "$REQUESTED_COMMIT" --projection "$PROJECTION" \
            --output "pbs-$PROJECTION-receipt-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain immutable phase receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-${{ matrix.projection }}-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: pbs-${{ matrix.projection }}-receipt-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
  qualify-references:
    name: Verify PBS references / ${{ matrix.shard }}
    if: always() && needs.prepare.result == 'success'
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {shard: 0, key: "00"}
          - {shard: 1, key: "01"}
          - {shard: 2, key: "02"}
          - {shard: 3, key: "03"}
          - {shard: 4, key: "04"}
          - {shard: 5, key: "05"}
          - {shard: 6, key: "06"}
          - {shard: 7, key: "07"}
          - {shard: 8, key: "08"}
          - {shard: 9, key: "09"}
          - {shard: 10, key: "10"}
          - {shard: 11, key: "11"}
          - {shard: 12, key: "12"}
          - {shard: 13, key: "13"}
          - {shard: 14, key: "14"}
          - {shard: 15, key: "15"}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pbs-reference-complete-${{ needs.prepare.outputs.artifact_suffix }}
          path: input
      - name: Qualify one prepared reference window
        timeout-minutes: 55
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/qualify_prepared_pbs_shard.py \
            --exact-commit "$REQUESTED_COMMIT" --input input \
            --reference-shard "$SHARD" \
            --output "pbs-references-$SHARD-receipt-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain immutable reference receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-references-${{ matrix.shard }}-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: pbs-references-${{ matrix.shard }}-receipt-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    name: Verify complete PBS shard aggregate
    if: always() && github.ref == 'refs/heads/main'
    needs: [prepare, qualify, qualify-references]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # One durable bounded aggregate receipt only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: pbs-*-receipt-${{ github.run_id }}-*
          path: receipts
          merge-multiple: true
      - name: Verify exact shard coverage, identities, denominators and parity
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/aggregate_historical_pbs_qualification.py \
            --receipts receipts --exact-commit "$REQUESTED_COMMIT" \
            --reference-shards 16 \
            --output pbs-qualification-receipt.json
      - name: Persist the sole aggregate receipt in the track issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 341 --repo "$GITHUB_REPOSITORY" \
            --body-file pbs-qualification-receipt.json
      - name: Retain aggregate receipt without source material
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-historical-qualification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: pbs-qualification-receipt.json
          if-no-files-found: error
          retention-days: 30
  prepare-reference-groups:
    name: Prepare PBS reference group / ${{ matrix.group }}
    needs: qualify
    if: always() && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Stream one four-partition group from the exact public source
        timeout-minutes: 55
        env:
          GROUP: ${{ matrix.group }}
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.14.6 python scripts/prepare_historical_pbs_reference_node.py \
            --exact-commit "$REQUESTED_COMMIT" --reference-shards 16 \
            --group-index "$GROUP" --group-count 4 \
            --output node --receipt "reference-group-$GROUP-receipt.json"
      - name: Retain only the assigned derived group and bounded receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-reference-node-group-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            node/reference-*.arrow
            reference-group-${{ matrix.group }}-receipt.json
          if-no-files-found: error
          retention-days: 1
