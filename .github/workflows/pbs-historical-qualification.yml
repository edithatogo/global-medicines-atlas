name: Qualify pinned historical PBS projections

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing the reviewed qualifier
        required: true
        type: string

permissions: {}

concurrency:
  group: pbs-historical-projection-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify pinned public PBS lineage and projection denominators
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      issues: write # Durable bounded aggregate receipt, not raw payloads.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Verify original public PBS archive and all projections anonymously
        timeout-minutes: 55
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/qualify_historical_pbs_public.py \
            --exact-commit "$REQUESTED_COMMIT" --output pbs-qualification-receipt.json
      - name: Persist aggregate receipt durably in the track issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          if ! test -s pbs-qualification-receipt.json; then
            uv run --locked --python 3.14.6 python scripts/qualify_historical_pbs_public.py \
              --exact-commit "$REQUESTED_COMMIT" --failure-only \
              --output pbs-qualification-receipt.json
          fi
          gh issue comment 341 --repo "$GITHUB_REPOSITORY" \
            --body-file pbs-qualification-receipt.json
      - name: Retain aggregate receipt without raw source material
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pbs-historical-qualification-receipt
          path: pbs-qualification-receipt.json
          if-no-files-found: error
          retention-days: 30
