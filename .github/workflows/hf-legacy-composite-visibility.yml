name: Publicize exact legacy Hugging Face composite

on:
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact authorized legacy composite revision
        required: true
        type: string
        default: 654f71c84cdb17b4032396bcbc961bef8757fb19
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: hf-legacy-composite-visibility
  cancel-in-progress: false

permissions: {}

jobs:
  publicize-and-verify:
    name: Publicize exact revision and restore anonymously
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # Required to persist the intent and success receipt on issue 340.
    steps:
      - name: Check out exact authorization contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Record durable rollback intent before visibility mutation
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSACTION_DATASET: edithatogo/global-medicines-atlas-international-open
          TRANSACTION_REVISION: 654f71c84cdb17b4032396bcbc961bef8757fb19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          intent = {
              'schema_id': (
                  'global-medicines-atlas.hf-legacy-composite-visibility-intent'
              ),
              'schema_version': 1,
              'dataset': os.environ['TRANSACTION_DATASET'],
              'immutable_revision': os.environ['TRANSACTION_REVISION'],
              'rollback_required_until_durable_success_receipt': True,
              'workflow_run': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/"
                  f"runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              'workflow_commit': os.environ['GITHUB_SHA'],
          }
          Path('hf-legacy-composite-visibility-intent.json').write_text(
              json.dumps(intent, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          gh issue comment 340 \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file hf-legacy-composite-visibility-intent.json

      - name: Verify, publicize, and clean-room restore
        env:
          AUTHORIZATION_PATH: quality/qualifications/hf-legacy-composite-authorization-20260829.json
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REQUESTED_REVISION: ${{ inputs.exact_revision }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet huggingface-hub==1.14.0
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from huggingface_hub import HfApi, hf_hub_download, snapshot_download


          def digest(path: Path) -> str:
              value = sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()


          authorization = json.loads(
              Path(os.environ['AUTHORIZATION_PATH']).read_text(encoding='utf-8')
          )
          if (
              not authorization['external_publication_authorized']
              or not authorization['maintainer_asserted_redistribution_permission']
              or authorization['operation']
              != 'make-existing-exact-revision-public-no-upload'
          ):
              raise RuntimeError('exact visibility authorization is not satisfied')

          candidate = authorization['candidate']
          baseline = authorization['public_baseline']
          if os.environ['REQUESTED_REVISION'] != candidate['revision']:
              raise RuntimeError('requested revision differs from exact authorization')

          token = os.environ['HF_TOKEN']
          private_api = HfApi(token=token)
          private_info = private_api.dataset_info(candidate['dataset'])
          if private_info.sha != candidate['revision']:
              raise RuntimeError('candidate default head differs from authorization')

          rollback_intent = bool(private_info.private)
          with TemporaryDirectory(prefix='gma-hf-visibility-') as temporary:
              root = Path(temporary)
              candidate_manifest = Path(
                  hf_hub_download(
                      candidate['dataset'],
                      'manifest.json',
                      repo_type='dataset',
                      revision=candidate['revision'],
                      token=token,
                      local_dir=root / 'candidate-contract',
                  )
              )
              candidate_readme = Path(
                  hf_hub_download(
                      candidate['dataset'],
                      'README.md',
                      repo_type='dataset',
                      revision=candidate['revision'],
                      token=token,
                      local_dir=root / 'candidate-contract',
                  )
              )
              baseline_manifest = Path(
                  hf_hub_download(
                      baseline['dataset'],
                      'manifest.json',
                      repo_type='dataset',
                      revision=baseline['revision'],
                      token=False,
                      local_dir=root / 'baseline-contract',
                  )
              )
              baseline_readme = Path(
                  hf_hub_download(
                      baseline['dataset'],
                      'README.md',
                      repo_type='dataset',
                      revision=baseline['revision'],
                      token=False,
                      local_dir=root / 'baseline-contract',
                  )
              )
              if digest(candidate_manifest) != candidate['manifest_sha256']:
                  raise RuntimeError('candidate manifest digest drifted')
              if digest(baseline_manifest) != baseline['manifest_sha256']:
                  raise RuntimeError('public baseline manifest digest drifted')
              if candidate_manifest.read_bytes() != baseline_manifest.read_bytes():
                  raise RuntimeError('candidate and public manifests differ')
              if candidate_readme.read_bytes() != baseline_readme.read_bytes():
                  raise RuntimeError('candidate and public dataset cards differ')

              manifest = json.loads(candidate_manifest.read_text(encoding='utf-8'))
              files = manifest.get('files')
              if (
                  manifest.get('archived_source_count') != candidate['source_count']
                  or not isinstance(files, list)
                  or len(files) != candidate['payload_file_count']
              ):
                  raise RuntimeError('candidate manifest denominator drifted')
              paths = {entry['path'] for entry in files}
              if len(paths) != len(files):
                  raise RuntimeError('candidate manifest has duplicate paths')
              siblings = {item.rfilename for item in private_info.siblings}
              expected_siblings = paths | {'.gitattributes', 'README.md', 'manifest.json'}
              if siblings != expected_siblings:
                  raise RuntimeError('candidate repository sibling set drifted')
              for entry in files:
                  if (
                      len(entry.get('sha256', '')) != 64
                      or not isinstance(entry.get('byte_count'), int)
                      or entry['byte_count'] <= 0
                  ):
                      raise RuntimeError('candidate manifest has invalid payload evidence')

              try:
                  if rollback_intent:
                      private_api.update_repo_settings(
                          candidate['dataset'], repo_type='dataset', private=False
                      )

                  public_info = None
                  for _attempt in range(12):
                      try:
                          observed = HfApi(token=False).dataset_info(
                              candidate['dataset']
                          )
                          if not observed.private and not observed.gated:
                              public_info = observed
                              break
                      except Exception:
                          pass
                      time.sleep(5)
                  if public_info is None or public_info.sha != candidate['revision']:
                      raise RuntimeError('candidate did not become anonymously public')

                  restore = Path(
                      snapshot_download(
                          candidate['dataset'],
                          repo_type='dataset',
                          revision=candidate['revision'],
                          token=False,
                          local_dir=root / 'anonymous-restore',
                          allow_patterns=['data/**', 'manifest.json', 'README.md'],
                      )
                  )
                  for entry in files:
                      restored = restore / entry['path']
                      if (
                          not restored.is_file()
                          or restored.stat().st_size != entry['byte_count']
                          or digest(restored) != entry['sha256']
                      ):
                          raise RuntimeError(
                              f"anonymous restore mismatch: {entry['path']}"
                          )
              except Exception:
                  if rollback_intent:
                      private_api.update_repo_settings(
                          candidate['dataset'], repo_type='dataset', private=True
                      )
                  raise

              receipt = {
                  'schema_id': 'global-medicines-atlas.hf-legacy-composite-visibility',
                  'schema_version': 1,
                  'dataset': candidate['dataset'],
                  'immutable_revision': candidate['revision'],
                  'manifest_sha256': candidate['manifest_sha256'],
                  'payload_file_count': len(files),
                  'payload_byte_count': sum(item['byte_count'] for item in files),
                  'source_count': candidate['source_count'],
                  'public_baseline': baseline,
                  'repository_private': False,
                  'repository_gated': False,
                  'visibility_changed': rollback_intent,
                  'content_uploaded_or_mutated': False,
                  'publication_performed_by_github_actions': True,
                  'anonymous_clean_room_restore': True,
                  'anonymous_digest_match_count': len(files),
                  'workflow_run': (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/"
                      f"runs/{os.environ['GITHUB_RUN_ID']}"
                  ),
                  'workflow_commit': os.environ['GITHUB_SHA'],
                  'durable_receipt_issue': (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
                      'issues/340'
                  ),
              }
              Path('hf-legacy-composite-visibility-receipt.json').write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Upload public visibility receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hf-legacy-composite-visibility-receipt
          path: hf-legacy-composite-visibility-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist successful receipt on the public track issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 340 \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file hf-legacy-composite-visibility-receipt.json

  rollback-on-non-success:
    name: Reconcile failed or cancelled visibility transaction
    needs: publicize-and-verify
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
          needs.publicize-and-verify.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write # Required to persist the rollback receipt on issue 340.
    steps:
      - name: Restore private visibility and record reconciliation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TRANSACTION_DATASET: edithatogo/global-medicines-atlas-international-open
          TRANSACTION_REVISION: 654f71c84cdb17b4032396bcbc961bef8757fb19
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet huggingface-hub==1.14.0
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          dataset = os.environ['TRANSACTION_DATASET']
          revision = os.environ['TRANSACTION_REVISION']
          before = api.dataset_info(dataset, revision=revision)
          observed_public = not bool(before.private)
          if observed_public:
              api.update_repo_settings(dataset, repo_type='dataset', private=True)
          after = api.dataset_info(dataset, revision=revision)
          if not after.private:
              raise RuntimeError('failed transaction was not restored to private')
          receipt = {
              'schema_id': (
                  'global-medicines-atlas.hf-legacy-composite-visibility-rollback'
              ),
              'schema_version': 1,
              'dataset': dataset,
              'immutable_revision': revision,
              'observed_public_before_reconciliation': observed_public,
              'repository_private_after_reconciliation': True,
              'trigger': 'failed-or-cancelled-dispatch',
              'workflow_run': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/"
                  f"runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              'workflow_commit': os.environ['GITHUB_SHA'],
          }
          Path('hf-legacy-composite-visibility-rollback.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Persist rollback receipt on the public track issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 340 \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file hf-legacy-composite-visibility-rollback.json

  reconcile-orphaned-public-visibility:
    name: Reconcile public visibility without a durable success receipt
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write # Required to read and persist watchdog receipts on issue 340.
    steps:
      - name: Check durable receipts and fail closed
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TRANSACTION_DATASET: edithatogo/global-medicines-atlas-international-open
          TRANSACTION_REVISION: 654f71c84cdb17b4032396bcbc961bef8757fb19
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --quiet huggingface-hub==1.14.0
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          from huggingface_hub import HfApi

          dataset = os.environ['TRANSACTION_DATASET']
          revision = os.environ['TRANSACTION_REVISION']
          repository = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }
          comments = []
          page = 1
          while True:
              request = Request(
                  f"https://api.github.com/repos/{repository}/issues/340/"
                  f"comments?per_page=100&page={page}",
                  headers=headers,
              )
              with urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          durable_success = False
          for comment in comments:
              if comment.get('user', {}).get('login') != 'github-actions[bot]':
                  continue
              try:
                  receipt = json.loads(comment.get('body', ''))
              except (TypeError, json.JSONDecodeError):
                  continue
              if (
                  receipt.get('schema_id')
                  == 'global-medicines-atlas.hf-legacy-composite-visibility'
                  and receipt.get('dataset') == dataset
                  and receipt.get('immutable_revision') == revision
                  and receipt.get('repository_private') is False
                  and receipt.get('repository_gated') is False
                  and receipt.get('anonymous_clean_room_restore') is True
                  and receipt.get('anonymous_digest_match_count') == 42
              ):
                  durable_success = True
                  break

          api = HfApi(token=os.environ['HF_TOKEN'])
          info = api.dataset_info(dataset)
          changed = False
          head_matches_authorization = info.sha == revision
          if (
              (not durable_success or not head_matches_authorization)
              and not info.private
          ):
              api.update_repo_settings(dataset, repo_type='dataset', private=True)
              changed = True
              confirmed = api.dataset_info(dataset, revision=revision)
              if not confirmed.private:
                  raise RuntimeError('orphaned public visibility was not contained')

          result = {
              'schema_id': (
                  'global-medicines-atlas.hf-legacy-composite-visibility-watchdog'
              ),
              'schema_version': 1,
              'dataset': dataset,
              'immutable_revision': revision,
              'durable_success_receipt_found': durable_success,
              'head_matches_authorization': head_matches_authorization,
              'orphaned_public_visibility_contained': changed,
              'workflow_run': (
                  f"https://github.com/{repository}/actions/"
                  f"runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              'workflow_commit': os.environ['GITHUB_SHA'],
          }
          Path('hf-legacy-composite-visibility-watchdog.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          PY

      - name: Persist watchdog containment receipt
        if: ${{ steps.reconcile.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 340 \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file hf-legacy-composite-visibility-watchdog.json
