name: Publish approved EMA snapshot

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact main commit containing the approved plan
        required: true
        type: string
      confirmation:
        description: Enter publish-approved-ema-snapshot
        required: true
        type: string

permissions:
  contents: read
  actions: read # Recover the exact approved artifact from the earlier CI run.

concurrency:
  group: ema-bronze-20261029-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify approved EMA snapshot
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-approved-ema-snapshot'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Recover exact approved source bytes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: '12896777847'
          run-id: '40873191471'
          github-token: ${{ github.token }}
          path: build/ema-publication/artifact
          merge-multiple: true
      - name: Publish once and verify anonymous digests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMA_PUBLICATION_ENVIRONMENT: production
          GMA_MAINTAINER_PUBLICATION_APPROVED: yes-i-approve-publication
          EXACT_COMMIT: ${{ inputs.exact_commit }}
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.19.0 \
            python scripts/publish_ema_snapshot.py \
            --artifact build/ema-publication/artifact \
            --output build/ema-publication/package \
            --exact-commit "$EXACT_COMMIT" --publish
      - name: Preserve publication receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ema-publication-receipts
          path: build/ema-publication/publication-receipts/
          if-no-files-found: warn
          retention-days: 90
