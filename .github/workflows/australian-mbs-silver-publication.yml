name: Publish qualified MBS Silver v4 candidate

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing source and destination authority
        required: true
        type: string

permissions: {}

concurrency:
  group: australian-legacy-hf-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Append, anonymously verify, and record MBS Silver v4
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Verify the exact retained intent artifact.
    env:
      HF_HOME: ${{ github.workspace }}/build/mbs-silver-hf-home
      HF_XET_CACHE: ${{ github.workspace }}/build/mbs-silver-hf-home/xet
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Validate exact main and record publication intent
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0 python -m scripts.publish_australian_mbs_silver_v4 --intent-only
      - name: Retain publication intent before mutation
        id: publication_intent
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-silver-publication-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mbs-silver-publication/intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Prepare, append, verify, and write receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ steps.publication_intent.outputs.artifact-id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run --locked --python 3.15.1 --with huggingface-hub==1.14.0
          python -m scripts.publish_australian_mbs_silver_v4
      - name: Retain verified publication receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-silver-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mbs-silver-publication/hosted-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove verified hosted cache
        run: |
          set -euo pipefail
          rm -rf "$HF_HOME" build/mbs-silver-publication
      - name: Report fail-honest outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : # Outbound comments prohibited; retain workflow artifacts instead.
