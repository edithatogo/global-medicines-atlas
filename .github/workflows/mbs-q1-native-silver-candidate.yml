name: Qualify exact Q1 native Silver candidate

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit to qualify
        required: true
        type: string

permissions: {}

concurrency:
  group: mbs-q1-native-silver-candidate
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify Q1 complete-source extraction and candidate rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Read exact existing objects and emit aggregates
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
          uv run --locked --python 3.14.6 python scripts/qualify_mbs_q1_native_silver.py \
            --exact-commit "$REQUESTED_COMMIT" --output q1-native-silver-candidate.json
      - name: Retain aggregate receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: q1-native-silver-candidate
          path: q1-native-silver-candidate.json
          if-no-files-found: error
          retention-days: 30
