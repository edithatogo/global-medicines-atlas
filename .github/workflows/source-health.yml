name: Verify published October ZIPs for local cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Anonymous October ZIP readback
    if: github.ref == 'refs/heads/codex/verify-public-october-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Check the pinned public ZIPs against the frozen plan
        env:
          OCTOBER_PARTITION: ${{ matrix.partition }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          uv run --locked --python 3.15.1 python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          import httpx

          from global_medicines_atlas.acquisition import AcquisitionPolicy, BoundIPAddressTransport
          from global_medicines_atlas.publication_transport import PublicationPlan
          from scripts.check_archive_status import hub_info
          from scripts.publish_october_openfda_hosted import OctoberReadback, PLAN_SHA256, REPOSITORY

          revision = "f0d60240cb55fa591ad6cf15540a0c2ce0a2eab8"
          folder = Path("quality/source-batches/openfda-all-20261030")
          plan = PublicationPlan.model_validate_json((folder / "publication-plan.json").read_bytes())
          if plan.sha256() != PLAN_SHA256 or plan.target.repository != REPOSITORY:
              raise ValueError("The frozen October plan does not match")

          policy = AcquisitionPolicy(allowed_hosts=("huggingface.co",))
          with httpx.Client(
              transport=BoundIPAddressTransport(policy=policy), timeout=30, trust_env=False
          ) as client:
              info = hub_info(client, REPOSITORY, revision)
          public = {row["rfilename"]: row for row in info["siblings"]}
          previous = json.loads((folder / "online-recovery.json").read_bytes())
          if previous["plan_sha256"] != PLAN_SHA256 or previous["resulting_revision"] != revision:
              raise ValueError("The prior readback is from a different archive")
          prior = {
              row["relative_path"]: (row["size"], row["sha256"])
              for batch in previous["published_batches"]
              for row in batch["verified"]
          }
          candidates = []
          for artifact in plan.artifacts:
              name = artifact.relative_path
              if not name.endswith(".json.zip") or name not in public:
                  continue
              remote = public[name]
              expected = artifact.size, artifact.sha256
              lfs = remote.get("lfs") or {}
              if (lfs.get("size"), lfs.get("sha256")) != expected or remote.get("size") != artifact.size:
                  raise ValueError(f"Public digest mismatch for {name}")
              if prior.get(name) != expected:
                  candidates.append(artifact)
          if len(candidates) != 1981:
              raise ValueError("The public ZIP inventory changed")

          partition = int(os.environ["OCTOBER_PARTITION"])
          verifier = OctoberReadback(timeout_seconds=180)
          result = {
              "observed_at": datetime.now(UTC).isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
              "partition": partition,
              "repository": REPOSITORY,
              "revision": revision,
              "plan_sha256": PLAN_SHA256,
              "verified": [],
              "unverified": [],
          }
          output = Path("build/october-verify") / f"partition-{partition}.json"
          output.parent.mkdir(parents=True)
          for artifact in candidates[partition::8]:
              try:
                  receipt = verifier.verify_artifact(target=plan.target, revision=revision, artifact=artifact)
              except (httpx.HTTPError, ValueError) as exc:
                  result["unverified"].append({"relative_path": artifact.relative_path, "error": type(exc).__name__})
              else:
                  result["verified"].append(receipt.model_dump(mode="json"))
              output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(f"Partition {partition} verified {len(result['verified'])} ZIPs; {len(result['unverified'])} unresolved")
          if result["unverified"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && hashFiles('build/october-verify/*.json') != ''
        with:
          name: october-anonymous-readback-${{ matrix.partition }}
          path: build/october-verify/*.json
          if-no-files-found: error
          retention-days: 90
