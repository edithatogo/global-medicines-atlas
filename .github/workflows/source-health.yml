name: Capture approved NADAC and EMA checksums

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Hash the four official source files
    if: github.ref == 'refs/heads/codex/hosted-nadac-ema-checksums-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Capture only the source digests and sizes
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          uv run --locked --python 3.15.1 python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path
          import httpx
          from scripts.check_archive_status import ema_status, nadac_status, response_chunks
          from global_medicines_atlas.acquisition import AcquisitionPolicy, BoundIPAddressTransport

          nadac_url = "https://download.medicaid.gov/data/nadac-national-average-drug-acquisition-cost-11-25-2026.csv"
          allowed_hosts = ("data.medicaid.gov", "download.medicaid.gov", "www.ema.europa.eu")
          policy = AcquisitionPolicy(allowed_hosts=allowed_hosts, max_redirects=0)
          checksum = hashlib.sha256()
          size = 0
          with httpx.Client(transport=BoundIPAddressTransport(policy=policy), timeout=45, trust_env=False) as client:
              nadac = nadac_status(client)
              if nadac["source_url"] != nadac_url:
                  raise ValueError("CMS metadata does not identify the approved November 25 CSV")
              for chunk in response_chunks(client, nadac_url, 512 * 1024**2):
                  if size == 0:
                      header = next(csv.reader([chunk.split(b"\n", 1)[0].decode("utf-8-sig")]))
                      if not {"ndc", "nadac per unit"} <= {value.strip().lower() for value in header}:
                          raise ValueError("CMS did not return the expected NADAC CSV header")
                  checksum.update(chunk)
                  size += len(chunk)
              if size == 0:
                  raise ValueError("CMS returned an empty CSV")
              ema = ema_status(client)
              if len(ema) != 3 or any(row["state"] != "candidate" for row in ema.values()):
                  raise ValueError("The three EMA workbook candidates could not be confirmed")

          evidence = {
              "observed_at": datetime.now(UTC).isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "python": platform.python_version(),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
              "sources": {
                  "us-cms-nadac": {
                      "source_url": nadac_url,
                      "size": size,
                      "sha256": checksum.hexdigest(),
                  },
                  **ema,
              },
          }
          Path("source-checksums.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: source-checksums
          path: source-checksums.json
          if-no-files-found: error
          retention-days: 90
