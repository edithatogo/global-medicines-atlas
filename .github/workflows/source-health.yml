name: Source health and schema drift

on:
  schedule:
    - cron: "23 16 * * 1" # Weekly source-health observation.
    - cron: "41 16 1 * *" # Monthly schema-drift observation.
  workflow_dispatch:

permissions:
  actions: read # Required to retrieve the prior fingerprint artifact.
  contents: read # Required by actions/checkout.

concurrency:
  group: source-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Bounded source observation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --python 3.14.6 --locked
      - name: Retrieve previous metadata baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/previous
          previous_run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/source-health.yml/runs?branch=main&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | sort_by(.id) | reverse | .[0].id // ""'
          )"
          if [[ -z "${previous_run_id}" ]]; then
            {
              echo "path="
              echo "provenance="
              echo "run_id="
              echo "commit="
            } >> "${GITHUB_OUTPUT}"
            echo "No previous metadata baseline is available."
            exit 0
          fi
          previous_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}" \
              --jq '.head_sha'
          )"
          artifact_url="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts" \
              --jq '[.artifacts[] | select(.name == "source-health-baseline" and .expired == false)] | .[0].archive_download_url // ""'
          )"
          test -n "${artifact_url}"
          gh api "${artifact_url}" > build/previous/baseline.zip
          unzip -q build/previous/baseline.zip -d build/previous
          test -f build/previous/source-health.json
          test -f build/previous/source-health-provenance.json
          {
            echo "path=build/previous/source-health.json"
            echo "provenance=build/previous/source-health-provenance.json"
            echo "run_id=${previous_run_id}"
            echo "commit=${previous_commit}"
          } >> "${GITHUB_OUTPUT}"
      - name: Run bounded metadata-only probes
        id: probe
        continue-on-error: true
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
          BASELINE_PROVENANCE: ${{ steps.baseline.outputs.provenance }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        shell: bash
        run: |
          baseline_args=()
          if [[ -n "${BASELINE_PATH}" ]]; then
            baseline_args=(
              --baseline "${BASELINE_PATH}"
              --baseline-provenance "${BASELINE_PROVENANCE}"
              --baseline-run-id "${BASELINE_RUN_ID}"
              --baseline-commit "${BASELINE_COMMIT}"
            )
          fi
          uv run --python 3.14.6 python scripts/check_source_health.py \
            "${baseline_args[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/source-health.yml" \
            --branch "$GITHUB_REF_NAME" \
            --conclusion success \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --observation-id "$GITHUB_RUN_ID"
      - name: Summarize schema drift
        if: always() && hashFiles('build/source-health.json') != ''
        shell: bash
        run: |
          {
            echo "## Source health and schema drift"
            echo
            echo '```json'
            jq '.summary' build/source-health.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload durable metadata baseline
        if: always() && hashFiles('build/source-health.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-health-baseline
          path: |
            build/source-health.json
            build/source-health-provenance.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Escalate detected schema drift
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error title=Schema drift detected::One or more comparable source schemas changed. Review the metadata-only report."
          exit 1
