name: Qualify frozen quarterly MBS demographic CSV candidates

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit to qualify
        required: true
        type: string

permissions: {}

concurrency:
  group: mbs-demographic-csv-candidates
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify quarterly CSV candidate rebuild
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        quarter: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Read exact existing objects and emit aggregates
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
          SELECTED_QUARTER: ${{ matrix.quarter }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
          uv run --locked --python 3.15.1 python scripts/qualify_mbs_demographic_csv_cohort.py \
            --quarter "$SELECTED_QUARTER" --exact-commit "$REQUESTED_COMMIT" --output demographic-csv-candidate.json
      - name: Retain aggregate receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: demographic-csv-candidate-${{ matrix.quarter }}
          path: demographic-csv-candidate.json
          if-no-files-found: error
          retention-days: 30
