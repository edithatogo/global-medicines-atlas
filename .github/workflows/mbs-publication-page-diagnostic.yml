name: Diagnose pinned MBS publication page transport

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact reviewed merged main commit containing the diagnostic
        required: true
        type: string

permissions: {}

concurrency:
  group: mbs-publication-page-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read only bounded official publication-page HTML
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Bind exact current main head
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
      - name: Probe fixed official publication page only
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/diagnose_mbs_publication_page.py \
            --output build/mbs-page-transport-diagnostic.json
      - name: Preserve failure-only receipt if probe was interrupted
        if: always()
        run: |
          set -euo pipefail
          if test -s build/mbs-page-transport-diagnostic.json; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('build/mbs-page-transport-diagnostic.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          receipt = {
              'schema_id': 'global-medicines-atlas.mbs-page-transport-diagnostic',
              'schema_version': 1,
              'observed_at': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'source_page': 'https://www.health.gov.au/resources/publications/medicare-annual-statistics-state-and-territory-2009-10-to-2025-26?language=en',
              'metadata_only': True,
              'workbook_requested': False,
              'publication_performed': False,
              'attempts': [{'outcome': 'interrupted_or_setup_failure'}],
          }
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Retain bounded metadata receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mbs-page-transport-diagnostic
          path: build/mbs-page-transport-diagnostic.json
          if-no-files-found: error
          retention-days: 30
