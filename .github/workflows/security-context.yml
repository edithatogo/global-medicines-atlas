name: Security and Context

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

# Historical uv builds use the patched, content-bound custom CA store.
env:
  SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem

permissions:
  contents: read

concurrency:
  group: security-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-detection:
    name: Repository and history leak detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_ASSET: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            --output "$GITLEAKS_ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ASSET}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_ASSET}" | sha256sum --check
          tar --extract --gzip --file "$GITLEAKS_ASSET" gitleaks
      - name: Scan target and pull request complete Git history
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="--full-history $GITLEAKS_BASE_SHA HEAD --diff-filter=tuxdb"
          else
            log_opts="--full-history HEAD --diff-filter=tuxdb"
          fi
          mkdir -p build
          ./gitleaks git --redact --no-banner --report-format json \
            --report-path build/gitleaks.json --log-opts="$log_opts" .
      - name: Upload leak-detection receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-history-report
          path: build/gitleaks.json
          if-no-files-found: warn
          retention-days: 30

  context:
    name: Context and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --python 3.15.1 --group dev --locked
      - name: Validate governed context
        run: |
          uv run python scripts/validate_context.py
          uv run python scripts/render_project_overview.py --check
      - name: Install and run actionlint
        env:
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint
          ./actionlint
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --group security zizmor --pedantic .github
      - name: Upload context receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: context-validation
          path: build/context-validation.json
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --python 3.15.1 --group dev --group security --locked
      - name: Audit locked Python environment
        run: uv run --group security pip-audit
      - name: Generate CycloneDX SBOM
        run: mkdir -p build && uv run --group security cyclonedx-py environment --output-file build/sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-cyclonedx-sbom
          path: build/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  dependency-submission:
    name: Submit complete locked dependency graph
    needs: supply-chain
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Dependency submission API requires this permission; trusted main only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
      - name: Build complete snapshot for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          uv venv --python 3.15.1 .venv
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.15.1"
          .venv/bin/python scripts/build_dependency_snapshot.py \
            --trusted-main --checkout-sha "$(git rev-parse HEAD)" \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --scanned "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output build/dependency-snapshot.json
      - name: Submit once to the native dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"
          gh api --method POST repos/edithatogo/global-medicines-atlas/dependency-graph/snapshots \
            --input build/dependency-snapshot.json > build/dependency-submission.json
      - name: Retain snapshot and native submission response
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: locked-dependency-submission
          path: |
            build/dependency-snapshot.json
            build/dependency-submission.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL SARIF results.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
