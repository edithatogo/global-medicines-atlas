name: Publish recovered NZULM 2023 corpus

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact main commit containing the reviewed member manifest
        required: true
        type: string
      confirmation:
        description: Enter publish-permitted-nzulm-2023
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nzulm-2023-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish permitted members and verify anonymous digests
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-permitted-nzulm-2023'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.6'
      - name: Recover exact source through temporary protected read URL
        env:
          RECOVERY_URL: ${{ secrets.NZULM_2023_RECOVERY_URL }}
          EXACT_COMMIT: ${{ inputs.exact_commit }}
        run: |
          test "$GITHUB_SHA" = "$EXACT_COMMIT"
          test -n "$RECOVERY_URL"
          case "$RECOVERY_URL" in
            https://sdmntpraustraliaeast.oaiusercontent.com/files/*/raw\?*) ;;
            *) exit 1 ;;
          esac
          mkdir -p build/nzulm-2023
          curl --fail --silent --show-error --max-time 180 \
            --max-filesize 36527993 --proto '=https' \
            --output build/nzulm-2023/source.zip "$RECOVERY_URL"
      - name: Publish once and verify every permitted object anonymously
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXACT_COMMIT: ${{ inputs.exact_commit }}
          GMA_PUBLICATION_ENVIRONMENT: production
          GMA_MAINTAINER_PUBLICATION_APPROVED: yes-i-approve-publication
        run: |
          uv run --locked --python 3.15.1 --with huggingface-hub==1.19.0 \
            python -m scripts.publish_nzulm_2023 \
            --source build/nzulm-2023/source.zip \
            --output build/nzulm-2023/package \
            --exact-commit "$EXACT_COMMIT" --publish
      - name: Preserve public-safe intent and verification receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nzulm-2023-publication-receipts
          path: build/nzulm-2023/publication-receipts/*.json
          if-no-files-found: warn
          retention-days: 90
