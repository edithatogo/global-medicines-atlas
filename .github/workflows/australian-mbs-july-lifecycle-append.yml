name: Append July MBS lifecycle metadata

on:
  workflow_dispatch:
    inputs:
      exact_contract_commit:
        description: Exact reviewed main commit containing the July lifecycle contract
        required: true
        type: string

# Historical uv builds use the patched, content-bound custom CA store.
env:
  SSL_CERT_FILE: ${{ github.workspace }}/.ci/trust/cacert.pem

permissions: {}

concurrency:
  group: australian-mbs-july-lifecycle-append
  cancel-in-progress: false

jobs:
  append:
    name: Verify existing payloads and append metadata only
    runs-on: ubuntu-24.04
    environment: australian-hf-publication
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/build/australian-mbs-july-lifecycle-cache
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Bind exact protected main and append contract
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.exact_contract_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          test "$GITHUB_SHA" = "$(gh api repos/edithatogo/global-medicines-atlas/commits/main --jq .sha)"

      - name: Verify exact public MBS objects and append lifecycle metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 --with huggingface-hub==1.14.0 \
            python scripts/publish_australian_mbs_july_lifecycle.py \
            --exact-commit "$GITHUB_SHA"

      - name: Record fail-honest outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : # Outbound comments prohibited; retain workflow artifacts instead.
