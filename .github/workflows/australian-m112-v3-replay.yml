name: Execute bounded M-112 v3 replay

on:
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact merged main commit containing this replay plan
        required: true
        type: string
      target_path:
        description: Exact raw B2 path from the qualified M-112 inventory
        required: true
        type: string

permissions: {}

concurrency:
  group: australian-m112-v3-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Verify one immutable raw B2 object and rebuild its registration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require exact default-branch identity
        env:
          REQUESTED_COMMIT: ${{ inputs.exact_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${GITHUB_SHA}" = "${REQUESTED_COMMIT}"
      - name: Validate the exact one-object replay plan
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          PLAN_PATH: ${{ runner.temp }}/gma-m112-v3-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 python scripts/qualify_m112_v3_replay.py \
            --target-path "$TARGET_PATH" \
            --output "$PLAN_PATH"
      - name: Verify anonymous pinned bytes and rebuild metadata registration
        env:
          WORK_DIR: ${{ runner.temp }}/gma-m112-v3-replay-${{ github.run_id }}-${{ github.run_attempt }}
          RECEIPT_PATH: ${{ runner.temp }}/gma-m112-v3-replay-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
          PLAN_PATH: ${{ runner.temp }}/gma-m112-v3-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          uv run --locked --python 3.14.6 --with huggingface-hub==1.14.0 \
            python scripts/execute_m112_v3_replay.py \
              --plan "$PLAN_PATH" \
              --work-dir "$WORK_DIR" \
              --output "$RECEIPT_PATH" \
              --workflow-commit "$GITHUB_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain aggregate-only replay receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: australian-m112-v3-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gma-m112-v3-replay-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary source bytes and receipt workspace
        if: always()
        env:
          WORK_DIR: ${{ runner.temp }}/gma-m112-v3-replay-${{ github.run_id }}-${{ github.run_attempt }}
          RECEIPT_PATH: ${{ runner.temp }}/gma-m112-v3-replay-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
          PLAN_PATH: ${{ runner.temp }}/gma-m112-v3-plan-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: rm -rf "$WORK_DIR" "$RECEIPT_PATH" "$PLAN_PATH"
