name: Data quality or provenance incident
description: Report incorrect, stale, misleading, or insufficiently evidenced medicine data.
title: "data incident: "
labels: ["type:data-incident", "priority:P1"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Provisional severity
      options: [P0, P1, P2, P3]
    validations: {required: true}
  - type: input
    id: affected
    attributes: {label: Affected release, snapshot, API response, or artifact digest}
    validations: {required: true}
  - type: input
    id: jurisdiction
    attributes: {label: Jurisdiction and programme}
    validations: {required: true}
  - type: input
    id: source
    attributes: {label: Official source URL or evidence identifier}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed problem and impact}
    validations: {required: true}
  - type: textarea
    id: clocks
    attributes: {label: Valid-time and observed-time context}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected evidence-preserving behaviour}
    validations: {required: true}
  - type: textarea
    id: containment
    attributes: {label: Containment or quarantine already applied}
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundary
      options:
        - label: No patient-identifiable or confidential information is included.
          required: true
