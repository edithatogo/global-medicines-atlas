<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">The GMA medallion architecture</title><desc id="desc">Four layers: Bronze contains B0 source index, B1 acquisition metadata and B2 immutable raw evidence. Silver preserves typed source values. Gold records reviewed links. Platinum supplies products. Qualification remains partial.</desc><style>text{font-family:system-ui,sans-serif;fill:#14283f}</style><rect x="0" y="0" width="1100" height="600" rx="10" fill="#f5f8fc"/><text x="26" y="40" font-size="27">Global Medicines Atlas · evidence to products</text><text x="26" y="70" font-size="16">Regulatory approval, funding, formulary and terminology remain independent.</text><rect x="24" y="104" width="330" height="365" rx="10" fill="#f6e6d6"/><text x="42" y="137" font-size="20">BRONZE · source evidence</text><rect x="38" y="157" width="302" height="86" rx="10" fill="#fffaf4"/><text x="50" y="182" font-size="17">B0 · Source index</text><text x="50" y="206" font-size="14">Authorities, datasets and URLs</text><text x="50" y="227" font-size="14">Indexing does not mean acquisition</text><rect x="38" y="253" width="302" height="86" rx="10" fill="#fffaf4"/><text x="50" y="278" font-size="17">B1 · Acquisition metadata</text><text x="50" y="302" font-size="14">Digests, rights, dates and receipts</text><text x="50" y="323" font-size="14">Append-only provenance</text><rect x="38" y="349" width="302" height="86" rx="10" fill="#fffaf4"/><text x="50" y="374" font-size="17">B2 · Raw evidence</text><text x="50" y="398" font-size="14">Native bytes or a lawful reference</text><text x="50" y="419" font-size="14">Immutable; retain licence exclusions</text><rect x="382" y="104" width="222" height="365" rx="10" fill="#e1e8f0"/><text x="394" y="137" font-size="17">SILVER · typed data</text><text x="394" y="190" font-size="13">Source-faithful MBS / PBS</text><text x="394" y="228" font-size="13">Identifiers and schema eras</text><text x="394" y="266" font-size="13">Native unresolved values</text><text x="394" y="304" font-size="13">Selected MBS tables qualified</text><text x="394" y="342" font-size="13">PBS projection is public</text><text x="394" y="380" font-size="13">Broader semantics open</text><rect x="618" y="104" width="222" height="365" rx="10" fill="#f5e7b5"/><text x="630" y="137" font-size="17">GOLD · reviewed links</text><text x="630" y="190" font-size="13">Temporal evidence graph</text><text x="630" y="228" font-size="13">Method and confidence</text><text x="630" y="266" font-size="13">Positive / negative controls</text><text x="630" y="304" font-size="13">Candidate links stay labelled</text><text x="630" y="342" font-size="13">No inferred equivalence</text><text x="630" y="380" font-size="13">Qualification is partial</text><rect x="854" y="104" width="222" height="365" rx="10" fill="#d9ecea"/><text x="866" y="137" font-size="17">PLATINUM · products</text><text x="866" y="190" font-size="13">CLI · API · Atlas · exports</text><text x="866" y="228" font-size="13">Pinned revisions and provenance</text><text x="866" y="266" font-size="13">Validity and uncertainty</text><text x="866" y="304" font-size="13">Software candidate delivered</text><text x="866" y="342" font-size="13">Exact cohorts exercised</text><text x="866" y="380" font-size="13">Live service gates open</text><text x="357" y="300" font-size="23">→</text><text x="594" y="300" font-size="23">→</text><text x="830" y="300" font-size="23">→</text><text x="26" y="505" font-size="16">GitHub: contracts, code, CI and evidence   ↔   Hugging Face: approved public archives and pinned objects</text><text x="26" y="539" font-size="15">Parquet and catalogues are rebuildable projections; B1/B2 retain evidentiary truth.</text><text x="26" y="570" font-size="15">Publication · semantics · admission · recovery · release each retain separate acceptance gates.</text></svg>
