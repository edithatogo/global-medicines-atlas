<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">GMA roadmap progress</title><desc id="desc">14 of 20 tracks closed; 84 of 92 tracked requirements verified. Counts are unweighted. Live federation, independent recovery and Stable v1 remain gated.</desc><style>text{font-family:system-ui,sans-serif;fill:#14283f}</style><rect x="0" y="0" width="1100" height="570" rx="10" fill="#f5f8fc"/><text x="26" y="40" font-size="27">Roadmap · measured progress, separate gates</text><text x="26" y="73" font-size="16">Snapshot 2026-11-03 · unweighted counts from the existing Conductor and Stable v1 ledgers</text><text x="26" y="125" font-size="21">Conductor delivery tracks closed</text><text x="26" y="157" font-size="18">14 / 20 completed · 70.0% · 6 remaining</text><rect x="26" y="173" width="1048" height="28" rx="10" fill="#d7e0ec"/><rect x="26" y="173" width="734" height="28" rx="10" fill="#277c83"/><text x="26" y="265" font-size="21">Tracked Stable v1 requirements verified</text><text x="26" y="297" font-size="18">84 / 92 completed · 91.3% · 8 remaining</text><rect x="26" y="313" width="1048" height="28" rx="10" fill="#d7e0ec"/><rect x="26" y="313" width="957" height="28" rx="10" fill="#277c83"/><rect x="26" y="390" width="244" height="82" rx="10" fill="#e7edf6"/><text x="38" y="421" font-size="17">Software candidate</text><text x="38" y="450" font-size="16">Delivered</text><rect x="294" y="390" width="244" height="82" rx="10" fill="#e7edf6"/><text x="306" y="421" font-size="17">Live federation</text><text x="306" y="450" font-size="16">Partial · gate open</text><rect x="562" y="390" width="244" height="82" rx="10" fill="#e7edf6"/><text x="574" y="421" font-size="17">Independent recovery</text><text x="574" y="450" font-size="16">Authority gap</text><rect x="830" y="390" width="244" height="82" rx="10" fill="#e7edf6"/><text x="842" y="421" font-size="17">Stable v1 release</text><text x="842" y="450" font-size="16">Blocked</text><text x="26" y="510" font-size="16">These proportions measure ledger completion, not source coverage, effort or release readiness.</text><text x="26" y="541" font-size="16">A single unmet mandatory gate can block release regardless of the percentage.</text></svg>
